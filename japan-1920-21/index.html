u", "Jokaku, brother of Unkei,"], ["Tankei", "Tankei, son of Jokaku."]]}], "footnotes": [], "transcriber_notes": ["Run-in list introduced 'Noted names are;—' (under the Wood-carving paragraph begun at the foot of p. 182); one row per person."], "id": "p0254_1", "scans": [{"label": "scan leaf 254", "url": "https://archive.org/details/japan-year-book-1920/page/n254/mode/1up"}]}, {"image": "p0254", "images": ["p0254", "p0255"], "printed_pages": ["183", "184"], "chapter": "Arts and Crafts", "table_no": null, "title": "Noted Names of Painters", "caption_extra": "5. The Ashikaga (or Higashiyama) Period (1333-1574) — Painting", "continued": false, "parts": [{"label": null, "columns": ["Section", "Name", "Entry (verbatim)"], "rows": [["Noted names of the native styles", "Awada-guchi Takamitsu", "Awada-guchi Takamitsu (or Ryuko), about 1394-1427, of Kose school."], ["Noted names of the native styles", "Cho Denshi", "Cho Denshi, otherwise Mei-cho, d. 1438, first studied Takuma style, then Li Lungmien of Sung style. finally creating a style of his own."], ["Noted names of the native styles", "Jaksai", "Jaksai, d. 1424, Tosa school and painter to Rokkaku temple, Kyoto."], ["Noted names of the native styles — Masters of the Tosa school who flourished during this period", "Yuki-hiko", "Yuki-hiko,"], ["Noted names of the native styles — Masters of the Tosa school who flourished during this period", "Yuki-mitsu", "his son Yuki-mitsu, about 1429-1440,"], ["Noted names of the native styles — Masters of the Tosa school who flourished during this period", "Mistunobu", "and Mistunobu, d. 1525, one of the three masters of the school."], ["Names noted in the black and white style", "Josetsu", "Josetsu about 1400, noted for having introduced the black and white style of China."], ["Names noted in the black and white style — Masters of the Kano school identified with this period", "Masanobu", "Masanobu, 1453-1499, founder of the school, studied under Josetsu"], ["Names noted in the black an 55/mode/1up"}, {"label": "scan leaf 256", "url": "https://archive.org/details/japan-year-book-1920/page/n256/mode/1up"}]}, {"image": "p0256", "images": ["p0256"], "printed_pages": ["185"], "chapter": "Arts and Crafts", "table_no": null, "title": "[Metal-workers of the Toyotomi period]", "caption_extra": "6. The Toyotomi (or Momoyama) Period — Metal-work.—In this field a greater activity was shown.", "continued": false, "parts": [{"label": null, "columns": ["Branch", "Name", "Note"], "rows": [["For sword-decorators", "Kojo", "of the Goto school"], ["For sword-decorators", "Genjo", "of the Goto school"], ["For sword-decorators", "Tokujo", "of the Goto school"], ["For sword-decorators", "Eijo", "of the Goto school"], ["in tsuba", "Umetada Shigeyoshi", "continuing from the preceding period"], ["in tsuba", "Okamoto Tomoharu", ""], ["in tsuba", "Odawara Masatsugu", ""], ["in armor-work", "Myochin Mune-iye", ""], ["in armor-work", "Myochin Munenobu", ""], ["in casting", "Nagoshi Yashichiro", "(d. 1593)"], ["in casting", "Nagoshi Sansho", "(d. 1638) who cast the monster bronze bell at Hokoji"], ["in casting", "Tsuji Yojiro", ""], ["in casting", "Nishimura Do-ni", "etc."]]}], "footnotes": [], "transcriber_notes": ["Run-in list within the Metal-work paragraph, split one row per person; names in italics."], "id": "p0256_1", "scans": [{"label": "scan leaf 256", "url": "https://archive.org/details/japan-year-book-1920/page/n256/mode/1up"}]}, {"image": "p0256", "images": ["p0256"], "printed_pages": ["185"], "chapter": "Arts and Crafts", "table_no": null, "title": "[Schools of painting of the Tokugawa period]", "caption_extra": "7. The Tokugawa (or Yedo) Period (1603-1868) — Broadly speaking, about ten native schools with three or four Chinese schools flourished during this period, as follows:—", "continued": false, "parts": [{"label": null, "columns": ["Group", "School"], "rows": [["Native schools", "Hanabusa"], ["Native schools", "Kano"], ["Native schools", "Kishi"], ["Native sc g/details/japan-year-book-1920/page/n375/mode/1up"}]}, {"image": "p0376", "images": ["p0376"], "printed_pages": ["305"], "chapter": "Social Politics and Labor Problems", "table_no": null, "title": "Strikers Arrested Under the Peace Regulation", "caption_extra": null, "continued": false, "parts": [{"label": null, "columns": ["Year", "Strikers — Cases", "Strikers — Strikers", "Arrests — Cases", "Arrests — Strikers", "Found guilty", "Acquitted", "Cases dropped"], "rows": [["1914", "50", "7,904", "4", "14", "4", "—", "10"], ["1915", "64", "7,852", "4", "49", "8", "32", "9"], ["1916", "108", "8,413", "16", "40", "16", "8", "16"], ["1917", "311", "50,590", "21", "155", "20", "15", "120"], ["1918", "417", "66,457", "34", "375", "63", "35", "239"]]}], "footnotes": ["N.B.—Of the arrests during 1918, cases remaining unsettled numbered 38. The \"rice-riots\" of 1918 are partly accountable for the sudden swelling of figures for the year."], "transcriber_notes": ["No printed totals.", "1917 Strikers Cases 311 / Strikers 50,590 differ from the 'Data for Strikes' table on p. 304 (398 / 57,309) — transcribed as printed."], "id": "p0376_1", "scans": [{"label": "scan leaf 376", "url": "https://archive.org/details/japan-year-book-1920/page/n376/mode/1up"}]}, {"image": "p0377", "images": ["p0377"], "printed_pages": ["306"], "chapter": "Social Politics and Labor Problems", "table_no": null, "title": "Labor Organizations", "caption_extra": "In Oct. 1919 there existed throughout Japan 759 labor organizations including more than 230,000 workmen classified according to the line of work as follows:—", "continued": false, "parts": [{"label": null, "columns": ["", "Dyeing", "Mechanical", "Chemical", "Transport", "Mining", "Total incl. others."], "rows": [["Org.", "85", "63", "96", "155", "102", "792"], ["Mem.", "45,778", "41,767", "12,840", "18,063", "46,766", "236,312"]]}], "footnotes": [], "transcriber_notes": ["'Total incl. others' includes unlisted lines of work (listed parts: Org. 501, Mem. 165,214) — not reconcilable by design.", "Printed total of organizations 792 differs from the 759 stated in the headnote — transcribed as printed."], "id": "p0377_1", "scans": [{"label": "scan leaf 377", "url": "https://archive.org/details/japan-year-book-1920/page/n377/mode/1up"}]}, {"image": "p0379", "images": ["p0379"], "printed_pages": ["308"], "chapter": "Women Problem", "table_no": null, "title": "Female Teachers in Elementary Schools", "caption_extra": "In professional sphere teaching comes first on the list, the total force in primary schools and girls' high schools being shown below:", "continued": false, "parts": [{"label": null, "columns": ["At End of March", "Female", "Male"], "rows": [["1916", "45,810", "117,182"], ["1917", "47,265", "118,799"], ["1918", "49,252", "118,176"]]}], "footnotes": [], "transcriber_notes": ["Printed horizontally as 'At End of March....1916 (Male) 1917 (Male) 1918 (Male)' with figures beneath; transposed to one row per year. Unlabelled figures under each year are the female teachers (per title); '(Male)' figures in the Male column."], "id": "p0379_1", "scans": [{"label": "scan leaf 379", "url": "https://archive.org/details/japan-year-book-1920/page/n379/mode/1up"}]}, {"image": "p0379", "images": ["p0379"], "printed_pages": ["308"], "chapter": "Women Problem", "table_no": null, "title": "Female Teachers in Girls' High Schools", "caption_extra": null, "continued": false, "parts": [{"label": null, "columns": ["At End of March", "Female", "Male"], "rows": [["1916", "2,630", "1,907"], ["1917", "2,743", "1,955"], ["1918", "2,878", "2,063"]]}], "footnotes": [], "transcriber_notes": ["Printed horizontally like the preceding table; transposed to one row per year."], "id": "p0379_2", "scans": [{"label": "scan leaf 379", "url": "https://archive.org/details/japan-year-book-1920/page/n379/mode/1up"}]}, {"image": "p0379", "images": ["p0379", "p0380"], "printed_pages": ["308", "309"], "chapter": "Women Problem", "table_no": null, "title": "Legal Status of Women", "caption_extra": "These points of difference are enumerated in the following:—", "continued": false, "parts": [{"label": null, "columns": ["No.", "Point of difference"], "rows": [["1.", "The legal restriction of age in marriage is different between men and women. According to the Civil Code of Japan, men must be above 17 years and women, 15 years."], ["2,", "There can be no existence of marriage without the voluntary agreement of the man and the woman when a marriage is to be contracted. If they have parents living, they must obtain their consent, unless the man has completed his 30th year and the woman her 25th. In the case of minors who have no parents alive, they must obtain the consent of their guardians and the family councils."], ["3.", "A woman becomes incompetent upon contracting a marriage; that is, it becomes necessary for her to obtain the permission of her husband in the conduct of important legal acts, as lending or borrowing of money, transfer of her own real estate or some valuable pieces of movable property, bringing of an action in a court of law, accepting or refusing a succession, etc."], ["4.", "A married couple are under legal obligation to cohabitation but the right of selecting the place of residence is invested in the husband."], ["5.", "A wife is supported as a matter of course by her husband in this country. There are no detailed provisions for regulating the property relations of man and wife, as there are but few cases of women's marrying with large dowries."], ["6.", "There are two classes of divorces; divorce by consent and divorce by judicial action. In the case of a divorce by consent, there is no partiality, as mutual consent is required to make a divorce effective. In the case of a divorce by judicial action, however, the wife is very partially dealt with, for, while the committing of adultery on the part of the wife is in itself a sufficient ground for bringing an action for divorce, in the case of the husband it is necessary that the husband guilty of adultery has been prosecuted by law upon the accusation of the husband of the woman who is party to the crime. The wife, therefore, cannot bring an action for divorce against her husband even when he keeps a concubine, resorts to houses of ill-fame, or comes into illicit relations with unmarried women or widows"], ["7.", "A wife cannot succeed to the house in precedence to a child, if she has one; in case she is without a child, she is to be chosen an heir to the house by the father or mother of her husband or by the council. A wife may, however, become an heir to bequeathed property."], ["8.", "In the case of succession to a house, a male has precedence over a female when there are two or more children in the house. A girl must give place to a boy even when she is his senior. A girl, even when she is a legitimate child, must give place to a boy who is a shoshi, or a natural child recognized by the father. In the case of succession to bequeathed property, the difference of sex is not taken into consideration, a shoshi and a natural child being entitled to half the share falling to a legitimate child."]]}], "footnotes": [], "transcriber_notes": ["Numbered list of points of difference; item 1 on p. 308, items 2-8 on p. 309. Line-break hyphenation removed; italics (shoshi) not marked.", "Item 2 numeral printed '2,' (with comma, glyph damaged but legible).", "Item 6 ends without a full stop as printed ('women or widows')."], "id": "p0379_3", "scans": [{"label": "scan leaf 379", "url": "https://archive.org/details/japan-year-book-1920/page/n379/mode/1up"}, {"label": "scan leaf 380", "url": "https://archive.org/details/japan-year-book-1920/page/n380/mode/1up"}]}, {"image": "p0384", "images": ["p0384"], "printed_pages": ["313"], "chapter": "Women Problem", "table_no": null, "title": "[Marriage record of graduates of the Tokyo Higher Women's School]", "caption_extra": "The alumni's marriage record is shown in the following tabl function showOne(id){const t=T.find(x=>x.id===id)||T[0];if(!t){$("#main").innerHTML="<p>No tables yet.</p>";return}
 mode="one";cur=t.id;$("#main").innerHTML=tableHTML(t,$("#q").value.trim())+LLMWARN;$("#main").scrollTop=0;
 document.querySelectorAll("#main table").forEach(initSort);mark()}
function showChapter(ch){const q=$("#q").value.trim();const ts=filtered();mode="chapter";cur=null;
 let h=`<div class="chhead">Chapter</div><h2 style="margin-bottom:6px">${esc(ch)}</h2><div class="chsum">${ts.length} table${ts.length===1?"":"s"}${$("#flag").checked||q?" matching the current filters":""}</div>`;
 h+=(ts.map(t=>tableHTML(t,q)).join("")||"<p>No tables match.</p>")+LLMWARN;
 $("#main").innerHTML=h;$("#main").scrollTop=0;document.querySelectorAll("#main table").forEach(initSort);
 if(enterAt&&ts.length){const t=enterAt==="first"?ts[0]:ts[ts.length-1];cur=t.id;const el=document.getElementById("t-"+t.id);if(el&&enterAt==="last")el.scrollIntoView({block:"start"});
  const a=document.querySelector(`#list a[href="#${CSS.escape(t.id)}"]`);if(a)a.scrollIntoView({block:"nearest"})}
 enterAt=null;mark()}
let enterAt=null;
function route(){const h=decodeURIComponent(location.hash.slice(1));
 if(h.startsWith("ch=")){const ch=h.slice(3);if($("#ch").value!==ch){$("#ch").value=ch;renderList()}showChapter(ch);return}
 if(mode==="chapter"&&h&&document.getElementById("t-"+h)){cur=h;document.getElementById("t-"+h).scrollIntoView({block:"start"});mark();return}
 showOne(h||(T[0]&&T[0].id))}
$("#main").addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b)return;const t=T.find(x=>x.id===b.dataset.id);if(!t)return;
 if(b.dataset.act==="dl"){const bl=new Blob(["﻿"+csv(t)],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=t.id+".csv";a.click()}
 else navigator.clipboard.writeText((t.parts||[]).map(p=>[p.columns,...p.rows].map(r=>r.join("\t")).join("\n")).join("\n\n"))});
$("#list").addEventListener("click",e=>{const c=e.target.closest(".ch");if(!c)return;location.hash="ch="+encodeURIComponent(c.textContent)});
// Up/Down arrows: previous/next table in the sidebar list (ignored while typing in a field)
document.addEventListener("keydown",e=>{if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;if(e.altKey||e.ctrlKey||e.metaKey)return;
 const tag=(document.activeElement&&document.activeElement.tagName)||"";if(/INPUT|SELECT|TEXTAREA/.test(tag))return;
 const links=[...document.querySelectorAll("#list a[href^='#']")];if(!links.length)return;
 document.body.classList.add("kbd");
 let i=links.findIndex(a=>a.classList.contains("on"));const down=e.key==="ArrowDown";
 const ch=$("#ch").value;
 // at either end of a chapter's list, step into the next/previous chapter
 if(ch&&i>-1&&((down&&i===links.length-1)||(!down&&i===0))){
  const opts=[...$("#ch").options].map(o=>o.value).filter(Boolean);const k=opts.indexOf(ch)+(down?1:-1);
  if(k>=0&&k<opts.length){e.preventDefault();enterAt=down?"first":"last";location.hash="ch="+encodeURIComponent(opts[k])}
  return}
 i=i<0?(down?0:links.length-1):Math.min(links.length-1,Math.max(0,i+(down?1:-1)));
 e.preventDefault();location.hash=links[i].getAttribute("href").slice(1);links[i].scrollIntoView({block:"nearest"})});
document.addEventListener("mousemove",()=>document.body.classList.remove("kbd"));
// Click-to-sort: asc -> desc -> original. Numeric-aware; blanks/dashes last; total rows pinned;
// sorting happens within blocks delimited by section-heading rows.
const pinRe=/^\s*(grand\s+)?(total|totals|sum|average|mean)\b/i;
function sortVal(s){s=(s||"").trim();if(s===""||/^[—–\-.…]+$/.test(s))return null;
 const neg=/^\(.*\)$/.test(s)||/^[-−–]\s*\d/.test(s);const n=s.replace(/[,\s¥$£%*†‡()]/g,"").replace(/^[-−–]/,"");
 if(/^\d+(\.\d+)?$/.test(n))return (neg?-1:1)*parseFloat(n);return s.toLowerCase()}
function cmp(a,b){if(a===null&&b===null)return 0;if(a===null)return 1;if(b===null)return -1;
 if(typeof a==="number"&&typeof b==="number")return a-b;return String(a).localeCompare(String(b),undefined,{numeric:true})}
function initSort(tbl){const ths=[...tbl.querySelectorAll("th.sortable")];
 ths.forEach(th=>th.addEventListener("click",()=>{const col=+th.dataset.col;const cur=th.getAttribute("aria-sort");
  const next=cur==="ascending"?"descending":cur==="descending"?null:"ascending";
  ths.forEach(x=>x.removeAttribute("aria-sort"));if(next)th.setAttribute("aria-sort",next);
  const tb=tbl.tBodies[0];const rows=[...tb.rows];const blocks=[[]];
  rows.sort((a,b)=>a.dataset.i-b.dataset.i).forEach(r=>{if(r.classList.contains("sec")){blocks.push([r]);blocks.push([])}else blocks[blocks.length-1].push(r)});
  const out=[];blocks.forEach(bl=>{if(bl.length&&bl[0].classList.contains("sec")){out.push(...bl);return}
   if(!next){out.push(...bl);return}
   const pinned=bl.filter(r=>pinRe.test(r.cells[0].textContent)),body=bl.filter(r=>!pinRe.test(r.cells[0].textContent));
   body.sort((a,b)=>{const va=sortVal(a.cells[col].textContent),vb=sortVal(b.cells[col].textContent);
    if(va===null||vb===null)return cmp(va,vb);const c=cmp(va,vb);return next==="ascending"?c:-c});
   out.push(...body,...pinned)});
  out.forEach(r=>tb.appendChild(r))}))}
function mark(){const id=cur||decodeURIComponent(location.hash.slice(1));document.querySelectorAll("#list a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+id))}
$("#ch").addEventListener("input",()=>{renderList();const ch=$("#ch").value;
 if(ch)location.hash="ch="+encodeURIComponent(ch);else{history.replaceState(null,"",location.pathname);showOne(T[0]&&T[0].id)}});
["q","flag"].forEach(k=>$("#"+k).addEventListener("input",()=>{renderList();if(mode==="chapter")showChapter($("#ch").value)}));
window.addEventListener("hashchange",route);
$("#toggle").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark"};
renderList();route();
</script>
</body>
