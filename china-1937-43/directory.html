const E=[{"a": "Chapter XXII: Associations and Societies", "s": "International Cultural Relations", "n": "Chinese-American Institute of Cultural Relations", "t": "Founded on February 22, 1939, to promote cultural relations and friendly cooperation between China and the United States. Among the principal activities undertaken are: holding regular cultural lectures, arranging special broadcast programs for America by graduates (Chinese and foreign) of American universities, translating selected articles from current American magazines for publication in Chinese newspapers, supporting the international movement for promoting the cause of the United Nations, engaging in research projects on subjects bearing on Sino-American cultural relations, extending courtesies and facilities to the U.S. Military Mission and the U.S.A.A.F. in Chungking, and exchanging motion pictures between China and America to show the war efforts of the two countries.\nIn November, 1942, the U. S. State Department donated to the institute a sum of US$18,000 (equivalent to $360,000) in support of its activities during the fiscal year ending June 30, 1943.\nPresent membership: 531. A branch institute has been organized in Chengtu.\nOfficers:—Honorary Presidents, Madame Chiang Kai-shek, Colonel Henry L. Stimson; President, H. H. Kung; Vice-Presidents, Chen Li-fu, Hu Shih, Arthur N. Young, Dwight Edwards; Secretary-General, P. T. Chen; Deputy Secretaries-General, Maurice E. Votaw, Wu Wen-tien, Treasurer, C. B. Rappe (Rev.) Business Manager, Chu Djang; Chinese Secretary, P. Y. Yin; English Secretary, Francis K. Pan; Liaison Secretaries, Edward Y. K. Kwong (China), Paul C. Meng (U.S.A.).\nAddress:—Chung San Rd., Chungking.", "p": "822", "l": "scan part 5, leaf 33", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n33/mode/1up"}, {"a": "Chapter XXII: Associations and Societies", "s": "International Cultural Relations", "n": "Sino-British Cultural Association", "t": "Founded in October, 1933, in Nanking, for the promotion of cultural relations and friendship among the peoples of China and Great Britain. The association has sponsored British professorships and lectureships in Chinese universities and also introduced Chinese scholars to lecture in British institutions of higher learning. Among other activities are exchange of English and Chinese books and publications, lectures relating to cultural relations, and social meetings. A periodical “Amity” is published in English. Membership: 496. Branch associations in Chengtu and Kunming.\nOfficers:—Presidents, Wang Shih-chieh, Sir Horace Seymour; Secretary-General, Han Li-Wu; Standing Committee, Chang Ping-chun, Chang Tao-fan, Cheng Tsang-po, Chow Keng-sheng, Yao Nien-yuan, T. K. Tseng, Lo Chia-luen, A. J. Bell, B. M. Barry, Keith Waller, W. G. Harmon.\nAddress:—189 Chung San Rd., Chungking.", "p": "822", "l": "scan part 5, leaf 33", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n33/mode/1up"}, {"a": "Chapter XXII: Associations and Societies", "s": "International Cultural Relations", "n": "Sino-Burman Cultural Association", "t": "Founded on December 21, 1939, to promote cultural relations and goodwill between China and Burma and to further Sino-Burman cooperation. In August, 1941, the association sponsored a Chinese Goodwill Mission to Burma, headed by Dr. Chiang Mon-lin, to return the courtesies of the Burmese Goodwill Mission to China in 1939. Since the fall of Rangoon, the association has helped students of Rangoon University to enroll in Chinese universities. Forums on questions relating to Burma are held from time to time. Membership: 158. The Burma-China Cultural Association, a sister organization of the association, was maintained in Rangoon before the fall of Burma. There is a Sino-Burman branch in Kunming.\nOfficers:—President, Lo Chia-luen; Vice-Presidents, Chang Wei-han, Daw Mya Sein (Miss Mya Sein); Secretary-General, Han Li-wu; Deputy Secretaries-general, H. P. Tseng, Ganga Singh.\nAddress:—197 Chung San Rd., Chungking.", "p": "822", "l": "scan part 5, leaf 33", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n33/mode/1up"}, {"a": "Chapter XXII: Associations and Societies", "s": "International Cultural Relations", "n": "Sino-French-Belgium-Swiss Cultural Association (Association Culturelle Sino-Franco-Belgo-Suisse)", "t": "Founded on March 26, 1939, for the purpose of promoting cultural relations, this organization also conducts classes in French and accounting and engages in academic studies and lectures. Branch associations are located in Kunming, Chengtu, Sian and Indo-China. Present membership is 1,200. Bulletin of the Sino-French-Belgium-Swiss Cultural Association and L'Europe et L'Asie (both in Chinese) are published.\nOfficers:—President, Wu Chih-hui; Director, Mao Ching-hsiang; Chief Secretary, Chen Yao-tong; Secretary-General, Chow Man-fain.\nAddress:—30 Ling Kiang Rd., Chungking.", "p": "823", "l": "scan part 5, leaf 33", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n33/mode/1up"}, {"a": "Chapter XXII: Associations and Societies", "s": "International Cultural Relations", "n": "Sino-Indian Cultural Association", "t": "Founded on May 2, 1935, for the purpose of promoting cultural relations between China and India. The association has donated valuable collections of Chinese classics to the International University in India, and has contributed funds for the construction of the university's China College buildings and dormitory. Membership: 300. (India Branch: International University, Calcutta.)\nOfficers:—Executive Committee—Chairman, Chu Chia-hua; Vice-chairman, Ku Meng-yu; Supervisory Committee—Chairman, Tai Chi-tao; Vice-chairman, Chen Pu-lei; Resident Members of the Executive Committee, Chang Tao-fan; Secretary-General, T. H. Cheng.\nAddress:—No. 27 Niu Ko To, Chungking.", "p": "823", "l": "scan part 5, leaf 33", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n33/mode/1up"}, {"a": "Chapter XXII: Associations and Societies", "s": "International Cultural Relations", "n": "Sino-Korean Cultural Association", "t": "Founded on September 17, 1942. Present membership: 500.\nOfficers:—President, Sun Fo; Executive Directors, Wu Te-chen, Chu Chia-hua, Pu Chun (Korean), King Kwei-chih (Korean); Executive Supervisors, Wang Shih-chieh, Ma Chao-chun, Hsu En-tseng, Liang Han-chao, Tsui Tung-wu (Korean); Secretary-General, Ssutu Teh; Deputy Secretary-General, An Yuan-sheng (Korean).\nAddress:—c/o Ssutu Teh, Legislative Yuan, Chungking.", "p": "823", "l": "scan part 5, leaf 33", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n33/mode/1up"}, {"a": "Chapter XXII: Associations and Societies", "s": "International Cultural Relations", "n": "Sino-Polish Cultural Association", "t": "First founded in June, 1933 in Nanking. Suspended when the war broke out but revived in Chungking in April, 1943.\nOfficers:—Honorary Presidents, Wu Chih-hui, Wang Shih-chieh, Count Alfred Poninski; Executive Committee, Chen Li-fu, Kuo Yu-shou, Li Hsi-mou, Peon Ju, Chiang Fu-tsung, A. H. Kokczynski, M. Habicht; Secretary-General, Yu Ho-jui.\nAddress:—(Temporary) c/o Chialing House, Chungking.", "p": "823", "l": "scan part 5, leaf 33", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n33/mode/1up"}, {"a": "Chapter XXII: Associations and Societies", "s": "International Cultural Relations", "n": "Sino-Soviet Cultural Association", "t": "Founded on September 30, 1935, to promote Sino-Soviet cultural relations. In 1939 the association sponsored an exhibition of Chinese fine arts in the U.S.S.R. (The collection was exhibited at the Eastern Museum in Moscow for more than a year, beginning in January, 1940 and later also at Leningrad.) Exhibitions of photographs depicting life, progress, reconstruction in U.S.S.R., lectures, and exchange of Chinese and Soviet cultural matters are frequently sponsored. The association also maintains a Russian language school. In addition to the monthly magazine the Sino-Soviet Cultural Relations, eight booklets have been published. Membership: 3,000.\nThere are 14 branch associations located in Yuanling (Hunan), Kukong, Kweiyang, Lanchow, Chengtu, Kweilin, Tihua, Kunming, Sian, Chungking, Ili (Sinkiang), Tacheng (Sinkiang), Yenan, and Southeastern Shensi.\nOfficers:—President, Sun Fo; Vice-Presidents, Shao Li-tze, Chen Li-fu; Executive Directors, H. C. Liang, Wang Kun-lun, Chang Si-man, Pu Tao-ming, Li Teh-chuan (Mme. Feng Yu-hsiang), Tsao Tsing-hua, Chou I-chih, Simen Tsung-hua, Hsu Pao-chu, Wang Yun-wu, Ke I-hung, Wen Yuan-ning, Hung Fang, L. W. Miklashevsky, E. F. Kovalev.\nAddress:—No. 198 Chung I Rd., Chungking.", "p": "823", "l": "scan part 5, leaf 33", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n33/mode/1up"}, {"a": "Chapter XXII: Associations and Societies", "s": "Social Sciences", "n": "Administration Society of China", "t": "Organized to engage in research and study of practical administrative problems. Actual workings and conditions of provincial and municipal administrative organs in China are studied through research committees and investigation groups. The Administrative Quarterly and books on administration are published.\nOfficers:—Executive Directors, Tan Hsi-hung, Wu Wei-tao, Wu Hsiang-ling, Chen Shih-cheng, Hsu Ching-chih, Chen Yao-wen, Chang Chih-pang, Chang Chung-tao, Hsu Kung-su, Tuanmu Kai, Hsieh Kwan-sheng.\nAddress:—c/o Tan Hsi-hung, Ministry of Economic Affairs, Chungking.", "p": "823", "l": "scan part 5, leaf 33", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n33/mode/1up"}, {"a": "Chapter XXV: Chinese Who's Who", "s": "", "n": "Ai, Wei (prefers T. W. Ai)", "t": "professor, born in Hupeh, 1891 ; B.S. St. John's Univ., 1919 ; M.A. Columbia, 1922 ; Ph.D. George Washington Univ., 1925 ; research fellow, Univ. College, London, 1931-32 ; now professor, National Central Univ.; address, National Central Univ., Chungking.", "p": "i", "l": "scan part 5, leaf 60", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n60/mode/1up"}, {"a": "Chapter XXV: Chinese Who's Who", "s": "", "n": "Ai, T. W", "t": "(see Ai, Wei).", "p": "i", "l": "scan part 5, leaf 60", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n60/mode/1up"}, {"a": "Chapter XXV: Chinese Who's Who", "s": "", "n": "Chan, Chak", "t": "(see Chen, Tzeh).", "p": "i", "l": "scan part 5, leaf 60", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n60/mode/1up"}, {"a": "Chapter XXV: Chinese Who's Who", "s": "", "n": "Chan, Chu-shih", "t": "Kuomintang leader, born in Kwangtung, 1895 ; elected reserve member, Kuomintang Central Executive Committee, 1931.", "p": "i", "l": "scan part 5, leaf 60", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n60/mode/1up"}, {"a": "Chapter XXV: Chinese Who's Who", "s": "", "n": "Chang, Carson", "t": "(see Chang, Chun-mai).", "p": "i", "l": "scan part 5, leaf 60", "u": "https://archive.org/details/china-handbook-1937-1943/China%20Handbook%201937-1943%20Part%205%20of%205/page/n60/mode/1up"}, {"a": "Chapter XXV: Chinese Who's Who", "s": "", "n": "Chang, Chao-yuan", "t": "government official, lawyer ; born in Chekiang, 1892 ; B.A. St. John's Univ., 1914 ; M.A. Columbia, 1916 ; J.D. Chicago, 1919 ; vice-minister of finance, 1928-29 ; const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
E.forEach(e=>{e._n=norm(e.n);e._all=norm(e.n+" "+e.t+" "+e.s)});
const groups=[...new Set(E.map(e=>e.a+(e.s?" — "+e.s:"")))];
const apps=[...new Set(E.map(e=>e.a))];
const sel=$("#ap");
apps.forEach(a=>{const o=document.createElement("option");o.value="A:"+a;o.textContent=a;sel.appendChild(o);
 groups.filter(g=>g.startsWith(a+" — ")).forEach(g=>{const o=document.createElement("option");o.value="G:"+g;o.textContent="   "+g.slice(a.length+3);sel.appendChild(o)})});
function hl(s,terms){s=esc(s);if(!terms.length)return s;
 // highlight accent-insensitively by matching on normalised text
 const src=s,n=norm(src);let marks=[];terms.forEach(t=>{let i=0;const et=norm(esc(t));while(et&&(i=n.indexOf(et,i))>-1){marks.push([i,i+et.length]);i+=et.length}});
 if(!marks.length)return s;marks.sort((a,b)=>a[0]-b[0]);let out="",pos=0;
 marks.forEach(([a,b])=>{if(a<pos)return;out+=src.slice(pos,a)+"<mark>"+src.slice(a,b)+"</mark>";pos=b});return out+src.slice(pos)}
let res=[],shown=0;const STEP=300;
function run(){const q=norm($("#q").value.trim());const terms=q.split(/\s+/).filter(Boolean);const v=sel.value;const no=$("#nameonly").checked;
 res=E.filter(e=>{if(v.startsWith("A:")&&e.a!==v.slice(2))return false;if(v.startsWith("G:")&&e.a+(e.s?" — "+e.s:"")!==v.slice(2))return false;
  const hay=no?e._n:e._all;return terms.every(t=>hay.includes(t))});
 $("#cnt").textContent=`${res.length.toLocaleString()} of ${E.length.toLocaleString()} entries`;
 $("#out").innerHTML="";shown=0;more(terms);
 try{history.replaceState(null,"",(q||v)?"#"+new URLSearchParams({q:$("#q").value.trim(),s:v}).toString():location.pathname)}catch(e){}}
function more(terms){terms=terms||norm($("#q").value.trim()).split(/\s+/).filter(Boolean);
 let h="",last=shown?groupOf(res[shown-1]):null;
 res.slice(shown,shown+STEP).forEach(e=>{const g=groupOf(e);if(g!==last){h+=`<div class="sec">${esc(g)}</div>`;last=g}
  h+=`<div class="e"><b>${hl(e.n,terms)}</b> <span class="t">${hl(e.t,terms)}</span><div class="m">p. ${esc(e.p)}${e.u?` · <a href="${e.u}" target="_blank" rel="noopener">${esc(e.l)}</a>`:e.l?" · "+esc(e.l):""}</div></div>`});
 $("#out").insertAdjacentHTML("beforeend",h);shown=Math.min(res.length,shown+STEP);$("#more").hidden=shown>=res.length}
const groupOf=e=>e.a+(e.s?" — "+e.s:"");
let tm;$("#q").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(run,120)});
sel.addEventListener("change",run);$("#nameonly").addEventListener("change",run);$("#more").addEventListener("click",()=>more());
$("#toggle").addEventListener("click",()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"});
try{const p=new URLSearchParams(location.hash.slice(1));if(p.get("q"))$("#q").value=p.get("q");if(p.get("s"))sel.value=p.get("s")}catch(e){}
run();
</script></body></html>
