vers, forming the Yung or Tatsieh, which reaches the sea at Chinhai, 12 miles distant."], ["Chusan Archipelago", "with the Saddle Islands lying to the N.E., the chief fishing centre of China. Chusan Island, 21 miles long and 11 broad, with two main harbours, Tinghai and Chinkiamen."], ["Nimrod Sound", "20 miles south of Ningpo. A long narrow fjord measuring 37 nautical miles in length and on an average 3 miles broad, narrowing down to 1 mile in the centre. At the head of the Sound the expanse of water stretches 7 miles north to south, and here are located the famous oyster-breeding establishments. The Sound has been proposed as a future naval base for China."], ["Sanmen Bay", "Bay of the Three Gateways: offering a variety of anchorages, but of uneven serviceability and exposed to high winds and typhoons."], ["Wenchow", "treaty port."], ["Santuao", "treaty port."], ["Foochow", "treaty port."], ["Pagoda anchorage.", ""], ["Amoy", "treaty port."], ["Kulangsu", "foreign settlement."], ["Swatow", "treaty port."], ["Mirs Bay", "included in the leased territory of Hongkong."], ["Kowloon", "Customs station."], ["Hongkong", "British territory."], ["Heungchow", "ten miles north of Macao, where a semi-official attempt is being made to create a new port and Chinese settlement on foreign lines."], ["Macao", "Portuguese territory."], ["Lappa", "Customs station."], ["Canton", "treaty port."], ["Kuangchouwan", "French leased territory."], ["Hainan", "island."], ["Pakhoi", "treaty port."]]}], "footnotes": [], "transcriber_notes": ["One-per-line list split at the first colon into Place / Description; entries without a colon are kept whole in the Place column (e.g. 'Dalny, called Tairen (Dairen) by the Japanese.').", "Newchwang and Yinkow are bracketed together with the shared description 'on the Liao River: ice-bound in winter'; the shared text is repeated in both rows with the bracket shown as '}'.", "Trailing full stops kept as printed."], "id": "p0045_1", "scans": [{"label": "", "url": null}, {"label": "", "url": null}]}, {"image": "p0047", "images": ["p0047"], "printed_pages": ["8"], "chapter": "The Chinese Empire", "table_no": null, "continued": false, "footnotes": [], "title": "[Ranges of the Tienshan Chain]", "caption_extra": "Orography. I. To the north-east is the Tienshan Chain, throwing out in a series of parallel spurs, running eastward, the following ranges:—", "parts": [{"label": null, "columns": ["Range", "Principal peak", "Height"], "rows": [["Tienshan-nan-lu", "Mustagh Ata or Tagharma Mountain, west of Yarkand", "25,000 ft."], ["Tienshan-pe-lu", "Tengri Khan", "23,600 ft."], ["Altai Mountains", "", "11,100 ft."], ["Tannu-ola Mountains", "", "—"]]}], "transcriber_notes": ["Peak names are printed only for the first two ranges; empty 'Principal peak' cells are not printed, not unreadable."], "id": "p0047_1", "scans": [{"label": "", "url": null}]}, {"image": "p0047", "images": ["p0047"], "printed_pages": ["8"], "chapter": "The Chinese Empire", "table_no": null, "continued": false, "footnotes": [], "title": "[Ranges of the Kuenlun Chain]", "caption_extra": "Orography. II. The Kuenlun Chain (20,000 ft.), running south of the Takla-Makan and Gobi Deserts and designated successively—", "parts": [{"label": null, "columns": ["Range", "Height"], "rows": [["Altyn Tagh", "14,000 ft."], ["Nanshan (where it enters Kansu province)", "14,000–16,000 ft."], ["Alashan", "17,000–18,000 ft."], ["Inshan", "10,000 ft."], ["Khinghan Mountains", "7,000 ft."]]}], "transcriber_notes": [], "id": "p0047_2", "scans": [{"label": "", "url": null}]}, {"image": "p0048", "images": ["p0048"], "printed_pages": ["9"], "chapter": "The Chinese Empire", "table_no": null, "continued": false, "footnotes": [], "title": "[Ranges of the third chain across southern China]", "caption_extra": "Orography. (b) The second running south-east between the valleys of the Mekong and Upper Yangtze, and then spreading out in a general north-easterly direction across the whole of southern China in a series of ranges known in part as—", "parts": [{"label": null, "columns": ["Range", "Height"], "rows": [["Shishan", "16,000 ft."], ["Nanling Mountains", ""], ["Yungling Mountains", ""], ["Nanshan", "9500 ft. }"], ["Tayuling", "9500 ft. }"]]}], "transcriber_notes": ["Heights given only where printed; empty cells are not printed, not unreadable.", "Nanshan and Tayuling are bracketed together with a single height '9500 ft.'; repeated in both rows with '}'.", "Shishan printed 'Shishan (16,000 ft.).'"], "id": "p0048_1", "scans": [{"label": "", "url": null}]}, {"image": "p0048", "images": ["p0048"], "printed_pages": ["9"], "chapter": "The Chinese Empire", "table_no": null, "continued": false, "footnotes": [], "title": "[Ridges of the Nanshan Mountains, from north to south]", "caption_extra": "In the second main chain the Nanshan Mountains are a series of parallel lofty ridges, among which may be mentioned (from north to south):—", "parts": [{"label": null, "columns": ["Item"], "rows": [["Alexander III Mountains."], ["Humboldt Mountains."], ["Ritter Mountains."]]}], "transcriber_notes": [], "id": "p0048_2", "scans": [{"label": "", "url": null}]}, {"image": "p0048", "images": ["p0048"], "printed_pages": ["9"], "chapter": "The Chinese Empire", "table_no": null, "continued": false, "footnotes": [], "title": "[Mountains between the Nanshan ranges and south-eastern Tibet, north to south]", "caption_extra": "Between these ranges and the south-eastern corner of Tibet come the following mountains in order from north to south:—", "parts": [{"label": null, "columns": ["Item"], "rows": [["Koko Mountains,"], ["Burkhan Bota (and to the east of them)"], ["Ame Machin Mountains,"], ["Baian Kara,"]]}], "transcriber_notes": [], "id": "p0048_3", "scans": [{"label": "", "url": null}]}, {"image": "p0048", "images": ["p0048"], "printed_pages": ["9"], "chapter": "The Chinese Empire", "table_no": null, "continued": false, "footnotes": [], "title": "[Individual peaks on the Chino-Tibetan border]", "caption_extra": "In China Proper we have the notable ranges, already referred to, running north and south on the Chino-Tibetan border, rising well above the snow-line. Among the individual peaks may be mentioned:—", "parts": [{"label": null, "columns": ["Item"], "rows": [["Mount Nenda, or “Holy Mountain.”"], ["Mount Jara, N.W. of Tachienlu."], ["Mount Omei."], ["Siwelung Shan."], ["The “Seven Nails” (? 19,000–20,000 ft.)."]]}], "transcriber_notes": [], "id": "p0048_4", "scans": [{"label": "", "url": null}]}, {"image": "p0048", "images": ["p0048"], "printed_pages": ["9"], "chapter": "The Chinese Empire", "table_no": null, "continued": false, "footnotes": [], "title": "Sacred Mountains", "caption_extra": null, "parts": [{"label": null, "columns": ["No.", "Mountain", "Province"], "rows": [["1.", "Tai Shan", "Shantung"], ["2.", "Heng Shan", "Shansi"], ["3.", "Sung Shan", "Honan"], ["4.", "Hua Shan", "Shensi"], ["5.", "Nan Yueh (Heng Shan)", "Hunan"]]}], "transcriber_notes": ["Printed as '1. Tai Shan in Shantung.' etc.; split into Mountain / Province."], "id": "p0048_5", "scans": [{"label": "", "url": null}]}, {"image": "p0048", "images": ["p0048", "p0049"], "printed_pages": ["9", "10"], "chapter": "The Chinese Empire", "table_no": null, "continued": false, "footnotes": [], "title": "[Other famous mountains]", "caption_extra": "Other famous mountains are—", "parts": [{"label": null, "columns": ["No.", "Mountain", "Description"], "rows": [["1.", "Mount Omei", "west of Kiatingfu, Szechuan (10,158 ft.) A pilgrim resort for Buddhists. L. Richard states that 56 pagodas have been erected on the mountain, the highest at an elevation of 10,000 ft. Mr. R. F. Johnston enumerates 35 monasteries or temples passed on a journey up and down the mountain."], ["2.", "The Three Peaks of Dokerla", "A centre of Tibetan pilgrimages. N.W. Yunnan (19,700 ft.)."], ["3.", "Wu Tai Shan", "North of Shansi. The monastery on this mountain is said to be the oldest in China. It is visited annually by thousands of pilgrims, Chinese, Mongolian and Tibetan. The Dalai Lama stayed here on his return from Peking to Lhasa (1909)."]]}], "transcriber_notes": ["Numbered list running from p. 9 to p. 10; mountain names printed in italics."], "id": "p0048_6", "scans": [{"label": "", "url": null}, {"label": "", "url": null}]}, {"image": "p0050", "images": ["p0050"], "printed_pages": ["11"], "chapter": "The Chinese Empire", "table_no": null, "continued": false, "footnotes": [], "title": "[Highest water-mark of the Yangtze at Hankow, 1865–1911]", "caption_extra": "Hydrography—Rivers. The following table, compiled by the Maritime Customs, gives the highest water-mark of the Yangtze at Hankow for the last 47 years above a zero low-level:—", "parts": [{"label": null, "columns": ["Year", "Feet", "Inches"], "rows": [["1865", "43", ""], ["1866", "48", "6"], ["1867", "45", "3"], ["1868", "44", "9"], ["1869", "49", "6"], ["1870", "50", "6"], ["1871", "43", "4"], ["1872", "46", "3"], ["1873", "43", ""], ["1874", "38", "2"], ["1875", "45", ""], ["1876", "43", "9"], ["1877", "34", "4"], ["1878", "48", "6"], ["1879", "41", "5"], ["1880", "39", "6"], ["1881", "37", "4"], ["1882", "46", "5"], ["1883", "45", "6"], ["1884", "36", "10"], ["1885", "45", "8"], ["1886", "41", "10"], ["1887", "48", "9"], ["1888", "40", "8"], ["1889", "48", "3"], ["1890", "46", "10"], ["1891", "43", "11"], ["1892", "44", "9"], ["1893", "44", "8"], ["1894", "43", ""], ["1895", "41", "3"], ["1896", "46", "8"], ["1897", "46", "8"], ["1898", "40", "7"], ["1899", "41", "10"], ["1900", "31", "3"], ["1901", "46", "5"], ["1902", "38", "3"], ["1903", "42", "6"], ["1904", "37", "10"], ["1905", "44", ""], ["1906", "45", "6"], ["1907", "44", "6"], ["1908", "44", "3"], ["1909", "46", "3"], ["1910", "39", "7"], ["1911", "47", "4"]]}], "transcriber_notes": ["Printed in three side-by-side blocks (1865–79, 1880–94, 1895–1911); merged in reading order.", "Years printed abbreviated to the last digit after the first of ea )", "13", "Right Bank", "Wei-ho"], ["3. Amur River", "13", "Left Bank", "Zeya (at Blagoveschensk)"], ["3. Amur River", "13", "Left Bank", "Bureya"], ["3. Amur River", "13", "Right Bank", "Sungari"], ["3. Amur River", "13", "Right Bank", "Ussuri"], ["6. West River (Si-kiang)", "13", "Left Bank", "Hua-kiang"], ["6. West River (Si-kiang)", "13", "Left Bank", "Liu-kiang"], ["6. West River (Si-kiang)", "13", "Left Bank", "Kuei-kiang"], ["6. West River (Si-kiang)", "13", "Left Bank", "Peh-kiang"], ["6. West River (Si-kiang)", "13", "Left Bank", "Tung-kiang"], ["6. West River (Si-kiang)", "13", "Right Bank", "Yuh-kiang"], ["6. West River (Si-kiang)", "13", "Right Bank", "Yung-kiang"], ["12. The Sungari", "14", "Left Bank", "Nonni, navigable up to Tsitsihar"], ["12. The Sungari", "14", "Right Bank", "Khurkha"], ["14. The Yalu", "14", "Right Bank", "Hun-kiang (Chief tributary)"]]}], "footnotes": [], "transcriber_notes": ["The chief rivers (numbered 1–16, pp. 10–14) are described in running paragraphs (recorded in report, not transcribed); only the run-in 'Tributaries' lists are tabulated here, one tributary per row. Tributaries mentioned only in prose (e.g. Red River: White River, Black River; Wei-ho: King-ho) are not included.", "Yellow River left-bank 'Tsln-ho' printed with an 'l' (probably a broken 'i', Tsin-ho); kept as printed.", "Yellow River 'Right Bank ;' printed with a semicolon; Amur 'Right Bank.—' printed with full stop and dash.", "Yalu: printed 'Chief tributary.—Right Bank: Hun-kiang.'", "West River: printed text continues after the right-bank list: 'Some authorities regard the Hungshui as a tributary and restrict the Si-kiang to the waterway below a point south-west of Nanning (Kueichou) where the stream is joined by the Yuh-kiang.'"], "id": "p0050_2", "scans": [{"label": "", "url": null}, {"label": "", "url": null}, {"label": "", "url": null}, {"label": "", "url": null}]}, {"image": "p0053", "images": ["p0053", "p0054"], "printed_pages": ["14", "15"], "chapter": "The Chinese Empire", "table_no": null, "title": "[Chief lakes of China Proper]", "caption_extra": "Hydrography—Lakes. The chief lakes of China Proper are:—", "continued": false, "parts": [{"label": null, "columns": ["No.", "Lake", "Description"], "rows": [["1.", "The Tungting lake", "in Hunan. In summer, when it receives the overflow of the Yangtze, its dimensions reach 75 miles in length and 65 in breadth (2000 sq. miles); but in winter the lake empties its waters into the Yangtze and becomes merely an enormous marsh, with two main river channels passing through it, the Yuenkiang and Siangkiang. In 1910 the provincial authorities made a start of dredging the lake, a machine having been bought for that purpose in Germany. The dredger was manned and operated by a Chinese crew, and began work on the Changteh channel."], ["2.", "The Po-yang lake", "in Kiangsi; 90 miles by 20 (approx.). The water rises nearly 30 ft. in the flood season, when the area of the lake is approximately 1800 sq. miles."], ["3.", "The Tai-hu, or Great Lake", "in Kiangsu, S. of the Yangtze. Its greatest dimensions are approximately 50 miles by 40 miles, but its waters recede in winter."], ["4.", "The Hungtseh lake", "in Kiangsu and Anhui, N. of the Yangtze, connected on the N.E. with the Grand Canal and on the S.E. with"], ["5.", "The Kaoyiu lake", "also in Kiangsu."], ["6.", "The Tatsung lake", "lies E. of the Kaoyiu, on the other side of the Grand Canal."], ["7.", "The Tien-hu lake", "in Yunnan, S. of Yunnanfu; approximately 38 miles in length and 8 in width and lying at an altitude of 6300 ft."], ["8.", "The Eulhai lake", "also in Yunnan, E. of Talifu. It lies at an altitude of 6500 ft. above sea-level, but is slightly smaller than the Tien-hu."], ["9.", "Dalai-nor and Buir-nor, or Pir Lake; Lake Hinka (Khanka)", "In Manchuria are to be found the Dalai-nor and Buir-nor, or Pir Lake, both S.W. of Kailar, and Lake Hinka (Khanka) in the extreme east of the province, W. of the Ussuri River."]]}], "footnotes": [], "transcriber_notes": ["Numbered list running from p. 14 to p. 15, split at the lake name (printed in italics). Item 4 runs on into item 5 as printed ('... on the S.E. with / 5. The Kaoyiu lake').", "Item 9 names several lakes in one sentence; full sentence kept as Description."], "id": "p0053_1", "scans": [{"label": "", "url": null}, {"label": "", "url": null}]}, {"image": "p0054", "images": ["p0054"], "printed_pages": ["15"], "chapter": "The Chinese Empire", "table_no": null, "title": "[Principal lakes of Tibet and Chinese Turkestan]", "caption_extra": "Hydrography—Lakes. In Tibet and Chinese Turkestan recent exploration has added largely to our knowledge of the lake system of these vast territories. Here it will suffice to enumerate the principal lakes.", "continued": false, "parts": [{"label": null, "columns": ["No.", "Lake", "Description"], "rows": [["1.", "Koko-nor", "in N.E. Tibet near the borders of Kansu, 65 miles long and 40 wide, with an area of 2300 sq. miles. It lies at an altitude of 10,500 ft. above sea-level. Its waters are salt."], ["2.", "Tsaidam", "west of the Koko-nor, now little more than a dreary swamp."], ["3.", "Lob-nor", "north of the Altyn Tagh range. Between 1877 and the present day this once important expanse of water has diminished in size to an enormous extent. Of these three basins Dr. A. H. Keane says in Stanford's Compendium of Geography: “The gradual isolation of all these basins affords one of the most striking illustrations of the process of desiccation that has been going on throughout Central Asia from the remotest times. First the Koko-nor fails to reach the Tsaidam; then the Tsaidam ceases to communicate with Lob-nor and ultimately dries up, while Lob-nor sinks to a mere reedy morass some 3 or 4 feet deep.”"], ["4.", "Kisil-Bash or Lake Ulungur", "between the Tienshan and Altai Mountains."], ["5", "Ike Aral-nor", "} in the extreme west of Mongolia."], ["6.", "Ubsa-nor", "} in the extreme west of Mongolia."] nor"], ["Russia", "", "Ekho (Elho)"], ["Russia", "", "Hailin (Khailine)"], ["Russia", "", "Hailar (Khailar)"], ["Russia", "", "Handaochezse"], ["Russia", "", "Hankow"], ["Russia", "", "Harbin"], ["Russia", "", "Imianpo"], ["Russia", "", "Kalgan"], ["Russia", "", "Kuanchengtze"], ["Russia", "", "Kuldja"], ["Russia", "", "Manchouli"], ["Russia", "", "Moulin"], ["Russia", "", "Peking"], ["Russia", "", "Pogranitschnaia"], ["Russia", "", "Shanghai"], ["Russia", "", "Taolaichao (Dalachao)"], ["Russia", "", "Tchuguchak"], ["Russia", "", "Tientsin"], ["Russia", "", "Tsitsihar"], ["Russia", "", "Urga"], ["Russia", "", "Utsumi"], ["Russia", "", "Yoman"], ["United States", "", "Shanghai."]]}], "footnotes": [], "transcriber_notes": ["Offices printed in three columns under each country; transcribed down each column in reading order.", "Great Britain: 'In Tibet: Gyantse; Phagri; Yatung' is a run-on line under the columns.", "Germany: Tsingtao, Litsun, Sifang, Weihsien are printed indented under 'Kiaochou Territory' in the middle column, between Hankow and Nanking.", "Japan: 'Leased Territory:—' and 'Manchuria:—' are run-on paragraphs under the Japan columns, split into one row per place."], "id": "p0258_1", "scans": [{"label": "", "url": null}, {"label": "", "url": null}]}, {"image": "p0261", "images": ["p0261"], "printed_pages": ["222"], "chapter": "The Government", "table_no": null, "title": "[The Emperor's immediate advisers up to 1911]", "caption_extra": "Up to the present year the Emperor's immediate advisers were:", "continued": false, "parts": [{"label": null, "columns": ["No.", "Body", "Description"], "rows": [["1.", "The Nei Ko (Inner Cabinet)", "the Supreme Council of the Empire;"], ["2.", "The Chün Chi Ch'u", "or Grand Council, corresponding to a Privy Council;"], ["3.", "The Cheng Wu Ch'u", "which was composed of members of (1) and (2), and Presidents of the Metropolitan Boards."]]}], "footnotes": [], "transcriber_notes": ["Chinese names printed in italics."], "id": "p0261_1", "scans": [{"label": "", "url": null}]}, {"image": "p0265", "images": ["p0265", "p0266"], "printed_pages": ["226", "227"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Waiwupu (Ministry of Foreign Affairs)]", "caption_extra": "The Ministries. The Waiwupu. Its duties are performed by four departments, viz.—", "continued": false, "parts": [{"label": null, "columns": ["No.", "Department", "Duties"], "rows": [["1.", "Diplomatic Intercourse", "This department undertakes treaty negotiations with all nations, recommends candidates for the posts of Ministers and Consuls abroad, arranges for the foreign Ministers' and officials' audiences with the Throne, recommends the bestowal of Chinese decorations upon foreign officials and others, and undertakes all foreign negotiations in Peking."], ["2.", "Routine Department", "which is charged with the supervision of all foreign interests in railways, mines, telegraphs, manufactures and dockyards, the employment of military or other foreign official, and questions affecting the emigration of coolies and the sending abroad of students. (Many of the functions here enumerated are now in the hands of the Yuchuanpu and the Nungkungshangpu.)"], ["3.", "Commercial and Finance Department", "which deals with matters affecting the Customs Tariff, the navigation of steamers in Chinese waters, foreign concessions and loans, and the expenditure of the Ministry itself, and of its Legations and Consulates abroad."], ["4.", "General Department", "which deals with boundary questions, missionaries, passports, compensation to foreigners, and police and legal questions so far as they concern foreigners."]]}], "footnotes": ["Each of these departments employs about ten under-secretaries and a staff of junior officials."], "transcriber_notes": ["Numbered list of departments printed as run-on paragraphs; split into number / department name / duties, text verbatim (hyphenation at line ends removed)."], "id": "p0265_1", "scans": [{"label": "", "url": null}, {"label": "", "url": null}]}, {"image": "p0266", "images": ["p0266", "p0267"], "printed_pages": ["227", "228"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Tuchihpu (Ministry of Finance)]", "caption_extra": "The Tuchihpu (Ministry of Finance, formerly Hupu). The Tuchihpu's work is carried on by fourteen separate departments:", "continued": false, "parts": [{"label": null, "columns": ["No.", "Department", "Duties"], "rows": [["1.", "Administrative Department", "the duties of which are to translate and compile books on financial matters, to direct the financial policy of the Empire, and to prepare the national budget."], ["2.", "The Advisory Department", "which is responsible for the preparation and revision of regulations regarding financial matters, and the supply of financial information to the Throne."], ["3.", "Land Tax Department", "which supervises the collection of land taxes, surveys of land, and leases and measurements of property."], ["4.", "Rice Tribute Department", "which is responsible for receiving the tribute rice from the south, for the inspection of the Imperial granaries in Peking and the provinces, and for the supply of rice to the troops in time of war and to the people in time of famine."], ["5.", "Revenue Department", "which receives the revenues from the Maritime and Native Customs, and taxes upon wine and tobacco, and supervises the issue of “red” title deeds and Customs passes."], ["6.", "Salt and Tea Tax Department", "which is in charge of the collection of salt and tea taxes, and the appointment of Provincial Salt Gabelle officials. It also supervises the collection of taxes upon native opium."], ["7.", "Currency Department", "which supervises provincial mining enterprises, the transportation of copper from Yunnan and Kueichow, the minting of gold and silver moneys, the printing of Government banknotes and the purchase of copper, bronze and other metals for coinage."], ["8.", "Treasury Department", "which has the custody of revenue from the provinces as well as tribute in silk and in kind (except grain)."], ["9.", "Official Salaries Department", "which pays the salaries of princes and other officials inside and outside Peking, and the expenses and victualling of the Army."], ["10.", "Military Audit Department", "which supervises expenditure upon the Army and Navy, the Manchu forces, the “Green” Army and police."], ["11.", "Works Department", "which controls conservancy, dockyard and other Government works."], ["12.", "General Audit Department", "which inspects all revenue and expenditure of the Empire, and drafts the Budget and estimates. This department is also in charge of the issue of Government bonds and the arrangements for paying foreign indemnities."], ["13.", "Bullion Department", "which has the custody of gold, silver and copper bullion, coins and paper money."], ["14.", "Registry", "which receives and dispatches documents and correspondence."]]}], "footnotes": ["The financial schools and colleges are also under the control of the Tuchihpu."], "transcriber_notes": ["Fourteen departments listed, matching the headnote.", "Numbered list printed as run-on paragraphs; split into number / department / duties, text verbatim (line-end hyphenation removed; 'bank-notes' broken across a line printed as 'bank- notes', rendered 'banknotes')."], "id": "p0266_1", "scans": [{"label": "", "url": null}, {"label": "", "url": null}]}, {"image": "p0267", "images": ["p0267"], "printed_pages": ["228"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Ministry of Education (Hsüeh Pu)]", "caption_extra": "Ministry of Education (Hsüeh Pu). ...it is divided into five departments, which deal respectively with:", "continued": false, "parts": [{"label": null, "columns": ["No.", "Business"], "rows": [["1.", "All general business, the preservation of memorials and records, the selection and translation of educational works and the publication of periodicals devoted to education."], ["2.", "The supervision of scientific, literary and musical instruction in universities."], ["3.", "The supervision of primary, middle and high schools."], ["4.", "The supervision of industrial and training schools and institutes."], ["5.", "Finance, the auditing and handling of funds, and the supervision of libraries and other properties of the Ministry."]]}], "footnotes": ["(See further under Education, Chapter XIX.)"], "transcriber_notes": [], "id": "p0267_1", "scans": [{"label": "", "url": null}]}, {"image": "p0268", "images": ["p0268"], "printed_pages": ["229"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Ministry of the Army (Lu Chun-pu)]", "caption_extra": "Ministry of the Army (Lu Chun-pu). ...consists of ten departments, whose duties are respectively:", "continued": false, "parts": [{"label": null, "columns": ["No.", "Duties"], "rows": [["1.", "Administrative, the custody of all documents, supervision of revenue and expenditure and of rewards and punishments of officers."], ["2.", "The preparation of military schemes, revision and issue of military regulations."], ["3.", "General supervision of the military system, and promotion and degradation of officers."], ["4.", "Supervision of the Green (Provincial) troops."], ["5.", "Supplies for the Army and military schools."], ["6.", "Stud department."], ["7.", "Medical department."], ["8.", "Martial law."], ["9.", "Auditing and finance."], ["10.", "Military education."]]}], "footnotes": [], "transcriber_notes": ["Ten departments listed, matching the headnote."], "id": "p0268_1", "scans": [{"label": "", "url": null}]}, {"image": "p0268", "images": ["p0268"], "printed_pages": ["229"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Ministry of the Navy (Hai Chün Pu)]", "caption_extra": "Ministry of the Navy (Hai Chün Pu). ...the work of the Ministry is conducted by a Secretariat of eight members, and nine departments, charged with the following duties:", "continued": false, "parts": [{"label": null, "columns": ["No.", "Duties"], "rows": [["1.", "General administration, control of the movements of naval vessels and general supervision of stores, etc."], ["2.", "Construction and repairs of ships."], ["3.", "Naval education."], ["4.", "Appointments, documents and telegrams."], ["5.", "Supplies of uniforms, stores and munitions"], ["6.", "Intelligence, hydrography and soundings."], ["7.", "Naval law."], ["8.", "Medical."], ["9.", "Auditing and finance."]]}], "footnotes": ["(See Navy, p. 259.)"], "transcriber_notes": ["Nine departments listed, matching the headnote. Item 5 printed without a final full stop."], "id": "p0268_2", "scans": [{"label": "", "url": null}]}, {"image": "p0268", "images": ["p0268", "p0269"], "printed_pages": ["229", "230"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Ministry of Laws (Fa Pu)]", "caption_extra": "Ministry of Laws (Fa Pu). ...It is divided into nine departments, whose functions are:", "continued": false, "parts": [{"label": null, "columns": ["No.", "Functions"], "rows": [["1.", "The preservation of records, and the preparation of evidence and findings for Imperial consideration; consideration and revision of sentences of the Supreme and Provincial Courts (subject to the confirmation of the Emperor) and the general supervision of administration of civil and criminal law in four provinces and two districts in Mongolia."], ["2.", "Consideration of sentences in Criminal Courts, particularly the preparation of lists of condemned prisoners for the Emperor's consideration each autumn, and the general supervision of administration of criminal and civil law in four provinces and two districts in the Mongolian dependencies (each department exercises this supervision over the administration of law in certain defined portions of the Empire)."], ["3.", "The custody of all documents, memorials and dispatches from provincial officials."], ["4.", "Pardons, amnesties and remissions of sentence."], ["5.", "Appointments, promotions and dismissals of provincial judicial officers."], ["6.", "Supervision of gaols under immediate control of the Ministry and in the provinces."], ["7.", "Auditing, receipt and payment of moneys and court fees."], ["8.", "Translation from Chinese into Manchu and vice versa of documents."], ["9.", "Registry of documents."]]}], "footnotes": ["(See Chapter XX, Public Justice.)"], "transcriber_notes": ["Headnote on p. 229; the nine items are printed at the head of p. 230. Nine departments listed, matching the headnote. Line-end hyphenation removed."], "id": "p0268_3", "scans": [{"label": "", "url": null}, {"label": "", "url": null}]}, {"image": "p0269", "images": ["p0269"], "printed_pages": ["230"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Ministry of the Interior (Minchengpu)]", "caption_extra": "Ministry of the Interior (Minchengpu). The Ministry contains two secretarial departments, and five departments whose duties are respectively to supervise and control:", "continued": false, "parts": [{"label": null, "columns": ["No.", "Duties"], "rows": [["1.", "Local municipal administration, census, promotion of public morality, and matters relating to landlords and tenants."], ["2.", "The training of police, and general supervision of their work."], ["3.", "The measurement and survey of estates, demarcation of boundaries, etc."], ["4.", "Supervision of architectural work, public works and the preservation of ancient buildings and monuments."], ["5.", "Public sanitation, the prevention of plague, examination of doctors and inspection of hospitals."]]}], "footnotes": [], "transcriber_notes": ["Five departments listed, matching the headnote."], "id": "p0269_1", "scans": [{"label": "", "url": null}]}, {"image": "p0270", "images": ["p0270"], "printed_pages": ["231"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Ministry of Agriculture, Commerce and Industry (Nungkungshangpu)]", "caption_extra": "Ministry of Agriculture, Commerce and Industry (Nungkungshangpu). ... Its work is conducted in four departments, whose duties are:", "parts": [{"label": null, "columns": ["No.", "Duties"], "rows": [["1.", "Improvement and development of agriculture, afforestation, mulberry cultivation, cattle-breeding and preservation of wild animals, maritime industries, and the drainage and irrigation of agricultural land."], ["2.", "Fostering of industries and manufactures, inspection, development and supervision of mines, and the control of mining concessions."], ["3.", "Supervision and regulation of chambers of commerce, commercial exhibitions, monopolies, insurance and general commercial affairs."], ["4.", "Handling the income and expenditure of the Ministry, and supervision of the miscellaneous work of the Ministry."]]}], "transcriber_notes": ["Section heading and opening prose on p0269 (printed p. 230); the list itself is wholly on p0270. Four departments listed, matching the headnote."], "footnotes": [], "continued": false, "id": "p0270_1", "scans": [{"label": "", "url": null}]}, {"image": "p0270", "images": ["p0270"], "printed_pages": ["231"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Ministry of Posts and Communications (Yuchuanpu)]", "caption_extra": "Ministry of Posts and Communications (Yuchuanpu). ... Its work is performed in four departments, which supervise and control:", "parts": [{"label": null, "columns": ["No.", "Duties"], "rows": [["1.", "Shipping, survey and sounding of harbours, organization of shipping companies and dockyards, lighthouses and buoys (which though nominally under this Ministry are still controlled by the Customs) and the revision and framing of shipping laws."], ["2.", "Railways generally, fixing of gauge, arrangement and repayment of railway loans, promotion of branch lines in the provinces, transport by rail, tramways, and the framing and revision of railway laws."], ["3.", "Telegraphs, government and commercial, framing and enforcement of telegraph regulations, agreements with foreign telegraph companies, telephones and electric light, and framing and revision of telegraph and telephone laws."], ["4.", "Posts, savings bank organized by the Post Office, money orders, parcel transport, design and issue of stamps, postal union agreements, and the framing and revision of postal laws."]]}], "transcriber_notes": ["Four departments listed, matching the headnote."], "footnotes": [], "continued": false, "id": "p0270_2", "scans": [{"label": "", "url": null}]}, {"image": "p0270", "images": ["p0270", "p0271"], "printed_pages": ["231", "232"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Ministry of Dependencies (Lifanpu)]", "caption_extra": "Ministry of Dependencies (Lifanpu). ... Its duties are performed by six departments, which supervise and control:", "parts": [{"label": null, "columns": ["No.", "Duties"], "rows": [["1.", "The Eight Banners, and the bestowal of titles upon Mongolian bannermen."], ["2.", "Colonial administration, Mongolian hunting affairs, and the succession of Lamas."], ["3.", "Court ceremonial in connexion with the reception of tribute from the Dependencies."], ["4.", "Court ceremonial for the reception of Priests and Lamas."], ["5.", "Reception of Mohammedan delegations and tribute; hunting and agriculture in the Dependencies."], ["6.", "Punishments of and penalties exacted from Mongolians, Tibetans and Mohammedans."]]}], "transcriber_notes": ["Items 1-3 on p0270 (p. 231), items 4-6 on p0271 (p. 232). Six departments listed, matching the headnote."], "footnotes": [], "continued": false, "id": "p0270_3", "scans": [{"label": "", "url": null}, {"label": "", "url": null}]}, {"image": "p0271", "images": ["p0271"], "printed_pages": ["232"], "chapter": "The Government", "table_no": null, "title": "[Sub-departments of the Department of Ceremonies (Tienliyuan)]", "caption_extra": "Department of Ceremonies (Tienliyuan). ... The work of the Department is carried on in four sub-departments, charged with the following duties:", "parts": [{"label": null, "columns": ["No.", "Duties"], "rows": [["1.", "General Department, responsible for preparing Imperial prayers, and the custody of tablets, temples, mausolea, etc., and payment of officers employed in these duties; preparation of programmes for Court ceremonies, such as the conferring of titles upon members of the Imperial Family, weddings, etc., ceremonies to be observed on Imperial journeys, agricultural and sericultural ceremonies, custody of Imperial chairs, robes (including correct changes for the seasons) and supervision of gifts from the Throne to officials, and vice versa."], ["2.", "Imperial Worship and Sacrificial Department, which draws up the procedure to be observed during Imperial worship at various temples, including the form of worship, prepares lists of the Imperial escort, and of utensils for use on ceremonial occasions, and supervises the bestowal of tablets upon deceased princes, sacrifices to their spirits, and prepares Imperial ancestral tables."], ["3.", "A Routine Department, which prescribes the fasting to be observed by the Emperor, arranges for the reading of prayers, music for ceremonial occasions and dances."], ["4.", "The last department prepares lists of dishes for feasts, and superintends sacrificial offerings, wines, libations and animals, etc."]]}], "transcriber_notes": ["Four sub-departments listed, matching the headnote."], "footnotes": [], "continued": false, "id": "p0271_1", "scans": [{"label": "", "url": null}]}, {"image": "p0272", "images": ["p0272"], "printed_pages": ["233"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Revenue Council (Shuiwuchu)]", "caption_extra": "The Revenue Council (Shuiwuchu). ... The Shuiwuchu has four departments, which deal, respectively, with:", "parts": [{"label": null, "columns": ["No.", "Duties"], "rows": [["1.", "Control of Imperial Maritime Customs Revenues on machinery and other manufactured goods and metals, Customs regulations, and the transmission of funds to Legations abroad."], ["2.", "The Native Customs, inspection of duty-free goods, collection of taxes upon salt, the revision of the tariff, and prevention of smuggling."], ["3.", "Collection of duties upon native and foreign opium, inspection of inland steam navigation, supervision of harbour-masters, lighthouses, and buoys, and the study of foreign tariffs."], ["4.", "Postal affairs (now handed over to the Yuchuanpu), appointments and rewards of Commissioners, appointments of officials under the Shuiwuchu, and the keeping of records of the services of all Customs officials, Chinese and foreign. This department is also responsible for auditing the expenses and income of the Customs."]]}], "footnotes": ["Several smaller departments deal with local Customs affairs."], "transcriber_notes": ["Four departments listed, matching the headnote."], "continued": false, "id": "p0272_1", "scans": [{"label": "", "url": null}]}, {"image": "p0272", "images": ["p0272"], "printed_pages": ["233"], "chapter": "The Government", "table_no": null, "title": "[Departments of the Imperial Board of Astronomy (Ch'intach'en)]", "caption_extra": "Imperial Board of Astronomy (Ch'intach'en). This Board predicts the climate, and studies the phenomena of the heavens in order to obey the heavenly signs. It is divided into four departments:", "parts": [{"label": null, "columns": ["No.", "Department"], "rows": [["1.", "Calendar Department, to draw up the calendar and indicate the auspicious days, calculate favourable days from the stars, etc."], ["2.", "Astronomy, which also undertakes to predict the future from heavenly phenomena."], ["3.", "Water-clock Department—a survival of the days when time was kept by water-clocks."], ["4.", "Astronomical Calculation (Mathematics) Department."], ["5.", "Instruction Department, for training students for future service under the Board."]]}], "transcriber_notes": ["Headnote says 'four departments' but five are listed (as printed)."], "footnotes": [], "continued": false, "id": "p0272_2", "scans": [{"label": "", "url": null}]}, {"image": "p0274", "images": ["p0274", "p0275"], "printed_pages": ["235", "236"], "chapter": "The Government", "table_no": null, "title": "[Principal officials in the provincial administration]", "caption_extra": "Provincial Administration. The principal officials in the provincial administration are:—", "parts": [{"label": null, "columns": ["No.", "Title", "Chinese title", "Description"], "rows": [["1.", "The Viceroy", "Tsung Tu", "or Governor General, who, except in the case of Chihli and Szechuan, rules two or more provinces. The Viceroy acts as Governor in the province in which his capital is situated, and controls the Governors of provinces within his jurisdiction. The memorial appended to this section defines in considerable detail the duties and responsibilities of Viceroys and Governors."], ["2.", "The Governor", "Hsün Fu", "who is the executive head of a single province, in some cases being under a Viceroy, and in others having independent jurisdiction."], ["3.", "Commissioner of Treasury or Provincial Treasurer", "Fantai", "who may be described as the Lieut. Governor, and is also in charge of the Provincial Exchequer, and is at the head of the Civil Service in the province."], ["4.", "Commissioner for Foreign Affairs", "Chiao She-shih", "a post which was created towards the end of the reign of the late Emperor to deal with the growing volume of business with foreigners at the provincial capitals."], ["5.", "Commissioner of Justice", "Ti Fa-shih", "who has replaced the old provincial Judge. His duties are fully defined in sections 12 and 13 of the attached memorial."], ["6.", "Tartar General", "Chiang Chün", "a Manchu official in charge of the Manchu garrisons in the province, and of Imperial Tombs, and other property. He ranks with the Viceroy, but the post is diminishing in importance."], ["7.", "Commissioner of Education", "T'i Hsueh-shih", "whose duties are defined in sections 10–11 of the attached memorial."], ["8.", "Salt Commissioner", "", "who is Chief Comptroller of revenue derived from the Provincial Salt Gabelle."], ["9.", "Grain Intendant", "", "who is Chief Comptroller of revenue derived from the grain tax, whether paid in money or in kind."]]}], "transcriber_notes": ["Items 1-2 on p0274 (p. 235); items 3-9 on p0275 (p. 236), after the Viceroyalty table (p0274_2.json) and a note on 'No Governor' provinces.", "Items 8 and 9 have no Chinese title printed."], "footnotes": [], "continued": false, "id": "p0274_1", "scans": [{"label": "", "url": null}, {"label": "", "url": null}]}, {"image": "p0274", "images": ["p0274"], "printed_pages": ["235"], "chapter": "The Government", "table_no": null, "title": "[Grouping of the provinces under Viceroys and Governors]", "caption_extra": "Provincial Administration. The following table shows the manner in which the provinces are grouped, or ruled under Viceroys and Governors respectively:—", "parts": [{"label": null, "columns": ["Viceroyalty", "Province", "[Head]", "Administrative Centre"], "rows": [["Manchuria", "Fengtien", "No Governor", "Mukden"], ["Manchuria", "Kirin", "Governor", "Mukden"], ["Manchuria", "Heilungkiang", "Governor", "Mukden"], ["Chihli", "Chihli", "Viceroy", "Tientsin"], ["Chihli", "Shantung", "Governor", "Tsinanfu"], ["Chihli", "Shansi", "Governor", "Taiyuanfu"], ["Chihli", "Honan", "Governor", "Kaifengfu"], ["Liang Kiang (Nanking)", "Kiangsu", "Governor", "Nanking and Soochow"], ["Liang Kiang (Nanking)", "Anhui", "Governor", "Anking"], ["Liang Kiang (Nanking)", "Kiangsi", "Governor", "Nanchang"], ["Shen-Kan", "Shensi", "Governor", "Sianfu"], ["Shen-Kan", "Kansu", "No Governor", "Lanchowfu"], ["Shen-Kan", "Sinkiang (Turkestan or New Dominion)", "Governor", "Urumtsi"], function renderList(){const q=$("#q").value.trim().toLowerCase(),ch=$("#ch").value,fl=$("#flag").checked;let h="",last=null,n=0;
 T.forEach((t,i)=>{if(ch&&(t.chapter||"(no chapter)")!==ch)return;if(fl&&!t._warn)return;if(q&&!q.split(/\s+/).every(w=>t._text.includes(w)))return;
  const c=t.chapter||"(no chapter)";if(c!==last){h+=`<div class="ch">${esc(c)}</div>`;last=c}
  h+=`<a href="#${t.id}" data-i="${i}">${esc(label(t))}<small>p. ${esc((t.printed_pages||[]).join(", "))}${HIDEIMG?"":" · "+esc(t.image)}${t._warn?" · ⚠":""}</small></a>`;n++});
 $("#list").innerHTML=h||"<p style='padding:10px'>No matches.</p>";mark()}
function hl(s,q){s=esc(s);if(!q)return s;q.split(/\s+/).filter(Boolean).forEach(w=>{s=s.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>")});return s}
function csv(t){const L=[];(t.parts||[]).forEach(p=>{if(p.label)L.push([p.label]);L.push(p.columns);p.rows.forEach(r=>L.push(r));L.push([])});
 return L.map(r=>r.map(c=>/[",\n]/.test(c??"")?'"'+String(c).replace(/"/g,'""')+'"':(c??"")).join(",")).join("\n")}
function tableHTML(t,q){let h=`<section class="tbl" id="t-${t.id}"><h2><a href="#${t.id}">${hl(label(t),q)}</a></h2><div class="sub">${esc(t.chapter||"")} · printed page${(t.printed_pages||[]).length>1?"s":""} ${esc((t.printed_pages||[]).join(", "))}${HIDEIMG?"":` · ${/^p\d/.test(t.image||"")?"scan leaf":"photo"} ${esc((t.images||[t.image]).join(", "))}`}</div>`;
 if(t.caption_extra)h+=`<div class="sub"><i>${hl(t.caption_extra,q)}</i></div>`;
 (t.parts||[]).forEach(p=>{if(p.label)h+=`<div class="part">${hl(p.label,q)}</div>`;
  h+=`<div class="tw"><table><thead><tr>${p.columns.map((c,j)=>`<th class="sortable" data-col="${j}" title="Click to sort">${hl(c,q)}</th>`).join("")}</tr></thead><tbody>`;
  p.rows.forEach((r,ri)=>{const sec=r.length>1&&r.slice(1).every(c=>c==="");h+=`<tr data-i="${ri}"${sec?' class="sec"':""}>`+r.map((c,j)=>`<td class="${j&&isNum(c)?"num":""}${j&&c===""&&!sec?" blank":""}">${hl(c,q)}</td>`).join("")+"</tr>"});
  h+="</tbody></table></div>"});
 if((t.footnotes||[]).length)h+=`<div class="notes"><b>Printed notes</b><ul>${t.footnotes.map(n=>`<li>${hl(n,q)}</li>`).join("")}</ul></div>`;
 if((t.transcriber_notes||[]).length)h+=`<div class="notes"><b>Transcriber's notes</b><ul>${t.transcriber_notes.map(n=>`<li class="${warnRe.test(n)?"warn":""}">${esc(n)}</li>`).join("")}</ul></div>`;
 h+=`<div class="row"><button data-act="dl" data-id="${t.id}">Download CSV</button><button data-act="cp" data-id="${t.id}">Copy as TSV</button></div>`;
 if(!HIDEIMG)h+=`<div class="sub">Source: ${(t.scans||[]).map(s=>s.url?`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a>`:esc(s.label)).join(", ")}</div>`;
 h+=`</section>`;
 return h}
const LLMWARN=`<div class="llmwarn" role="note"><b>Warning:</b> These tables were transcribed by the vision model of Opus 5.5. Before using any of these figures, you must verify specific statistics with the original source which is linked to whenever possible.</div>`;
function filtered(){const q=$("#q").value.trim().toLowerCase(),ch=$("#ch").value,fl=$("#flag").checked;
 return T.filter(t=>(!ch||(t.chapter||"(no chapter)")===ch)&&(!fl||t._warn)&&(!q||q.split(/\s+/).every(w=>t._text.includes(w))))}
let mode="one",cur=null;
function showOne(id){const t=T.find(x=>x.id===id)||T[0];if(!t){$("#main").innerHTML="<p>No tables yet.</p>";return}
 mode="one";cur=t.id;$("#main").innerHTML=tableHTML(t,$("#q").value.trim())+LLMWARN;$("#main").scrollTop=0;
 document.querySelectorAll("#main table").forEach(initSort);mark()}
function showChapter(ch){const q=$("#q").value.trim();const ts=filtered();mode="chapter";cur=null;
 let h=`<div class="chhead">Chapter</div><h2 style="margin-bottom:6px">${esc(ch)}</h2><div class="chsum">${ts.length} table${ts.length===1?"":"s"}${$("#flag").checked||q?" matching the current filters":""}</div>`;
 h+=(ts.map(t=>tableHTML(t,q)).join("")||"<p>No tables match.</p>")+LLMWARN;
 $("#main").innerHTML=h;$("#main").scrollTop=0;document.querySelectorAll("#main table").forEach(initSort);
 if(enterAt&&ts.length){const t=enterAt==="first"?ts[0]:ts[ts.length-1];cur=t.id;const el=document.getElementById("t-"+t.id);if(el&&enterAt==="last")el.scrollIntoView({block:"start"});
  const a=document.querySelector(`#list a[href="#${CSS.escape(t.id)}"]`);if(a)a.scrollIntoView({block:"nearest"})}
 enterAt=null;mark()}
let enterAt=null;
function route(){const h=decodeURIComponent(location.hash.slice(1));
 if(h.startsWith("ch=")){const ch=h.slice(3);if($("#ch").value!==ch){$("#ch").value=ch;renderList()}showChapter(ch);return}
 if(mode==="chapter"&&h&&document.getElementById("t-"+h)){cur=h;document.getElementById("t-"+h).scrollIntoView({block:"start"});mark();return}
 showOne(h||(T[0]&&T[0].id))}
$("#main").addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b)return;const t=T.find(x=>x.id===b.dataset.id);if(!t)return;
 if(b.dataset.act==="dl"){const bl=new Blob(["﻿"+csv(t)],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=t.id+".csv";a.click()}
 else navigator.clipboard.writeText((t.parts||[]).map(p=>[p.columns,...p.rows].map(r=>r.join("\t")).join("\n")).join("\n\n"))});
$("#list").addEventListener("click",e=>{const c=e.target.closest(".ch");if(!c)return;location.hash="ch="+encodeURIComponent(c.textContent)});
// Up/Down arrows: previous/next table in the sidebar list (ignored while typing in a field)
document.addEventListener("keydown",e=>{if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;if(e.altKey||e.ctrlKey||e.metaKey)return;
 const tag=(document.activeElement&&document.activeElement.tagName)||"";if(/INPUT|SELECT|TEXTAREA/.test(tag))return;
 const links=[...document.querySelectorAll("#list a[href^='#']")];if(!links.length)return;
 document.body.classList.add("kbd");
 let i=links.findIndex(a=>a.classList.contains("on"));const down=e.key==="ArrowDown";
 const ch=$("#ch").value;
 // at either end of a chapter's list, step into the next/previous chapter
 if(ch&&i>-1&&((down&&i===links.length-1)||(!down&&i===0))){
  const opts=[...$("#ch").options].map(o=>o.value).filter(Boolean);const k=opts.indexOf(ch)+(down?1:-1);
  if(k>=0&&k<opts.length){e.preventDefault();enterAt=down?"first":"last";location.hash="ch="+encodeURIComponent(opts[k])}
  return}
 i=i<0?(down?0:links.length-1):Math.min(links.length-1,Math.max(0,i+(down?1:-1)));
 e.preventDefault();location.hash=links[i].getAttribute("href").slice(1);links[i].scrollIntoView({block:"nearest"})});
document.addEventListener("mousemove",()=>document.body.classList.remove("kbd"));
// Click-to-sort: asc -> desc -> original. Numeric-aware; blanks/dashes last; total rows pinned;
// sorting happens within blocks delimited by section-heading rows.
const pinRe=/^\s*(grand\s+)?(total|totals|sum|average|mean)\b/i;
function sortVal(s){s=(s||"").trim();if(s===""||/^[—–\-.…]+$/.test(s))return null;
 const neg=/^\(.*\)$/.test(s)||/^[-−–]\s*\d/.test(s);const n=s.replace(/[,\s¥$£%*†‡()]/g,"").replace(/^[-−–]/,"");
 if(/^\d+(\.\d+)?$/.test(n))return (neg?-1:1)*parseFloat(n);return s.toLowerCase()}
function cmp(a,b){if(a===null&&b===null)return 0;if(a===null)return 1;if(b===null)return -1;
 if(typeof a==="number"&&typeof b==="number")return a-b;return String(a).localeCompare(String(b),undefined,{numeric:true})}
function initSort(tbl){const ths=[...tbl.querySelectorAll("th.sortable")];
 ths.forEach(th=>th.addEventListener("click",()=>{const col=+th.dataset.col;const cur=th.getAttribute("aria-sort");
  const next=cur==="ascending"?"descending":cur==="descending"?null:"ascending";
  ths.forEach(x=>x.removeAttribute("aria-sort"));if(next)th.setAttribute("aria-sort",next);
  const tb=tbl.tBodies[0];const rows=[...tb.rows];const blocks=[[]];
  rows.sort((a,b)=>a.dataset.i-b.dataset.i).forEach(r=>{if(r.classList.contains("sec")){blocks.push([r]);blocks.push([])}else blocks[blocks.length-1].push(r)});
  const out=[];blocks.forEach(bl=>{if(bl.length&&bl[0].classList.contains("sec")){out.push(...bl);return}
   if(!next){out.push(...bl);return}
   const pinned=bl.filter(r=>pinRe.test(r.cells[0].textContent)),body=bl.filter(r=>!pinRe.test(r.cells[0].textContent));
   body.sort((a,b)=>{const va=sortVal(a.cells[col].textContent),vb=sortVal(b.cells[col].textContent);
    if(va===null||vb===null)return cmp(va,vb);const c=cmp(va,vb);return next==="ascending"?c:-c});
   out.push(...body,...pinned)});
  out.forEach(r=>tb.appendChild(r))}))}
function mark(){const id=cur||decodeURIComponent(location.hash.slice(1));document.querySelectorAll("#list a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+id))}
$("#ch").addEventListener("input",()=>{renderList();const ch=$("#ch").value;
 if(ch)location.hash="ch="+encodeURIComponent(ch);else{history.replaceState(null,"",location.pathname);showOne(T[0]&&T[0].id)}});
["q","flag"].forEach(k=>$("#"+k).addEventListener("input",()=>{renderList();if(mode==="chapter")showChapter($("#ch").value)}));
window.addEventListener("hashchange",route);
$("#toggle").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark"};
renderList();route();
</script>
</body>
