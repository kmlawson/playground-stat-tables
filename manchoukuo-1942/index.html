 common territory between the two countries."], ["„", "Tientsin Treaty” concluded between Russia and China (June 13)."], ["„", "“Tientsin Treaty” between Great Britain and China signed (June 26)."], ["1860", "British and French troops enter Peking."], ["„", "By “Peking Treaty” (Nov. 2/14), Russia acquires the territory on the right bank of the Ussuri River."], ["1894-95", "Sino-Japanese War."], ["1895", "“Treaty of Shimonoseki” concluded between Japan and China (April 17)."], ["„", "By intervention of Russia, Germany and France (April 23), Japan obliged to announce retrocession of Liaotung peninsula (July 19)."], ["„", "Russo-Chinese Bank established with a capital of 15,000,000 rubles (Dec. 28)."], ["1896", "Treaty of Alliance between Russia and China (“Li-Lobanov Agreement”). (May 22)."], ["„", "“Contract for Construction and Operation of Chinese Eastern Railway” signed (Sept. 8), Russia obtains the right of constructing the C.E.R. through Kirin and Heilungkiang Provinces to connect Chita and Vladistok by a nearly straight railway line."], ["„", "Chinese Eastern Railway Company is established (Dec. 16)."], ["1898", "Germany acquires the lease of Kiaochow (March 6)."], ["", "Russia obtains twenty-five years’ lease of Liaotung peninsula (March 27)."], ["1898", "“Preliminary Loan Agreement for Peking-Newchwang Railway” signed by Hongkong and Shanghai Banking Corporation and China (June 7)."], ["„", "Great Britain acquires lease of Weihaiwei (July 1)."], ["„", "By the “Agreement concerning Southern Branch of Chinese Eastern Railway” Russia obtains the right to construct a railway which connects the C.E.R. to Liaotung peninsula (July 6). (Construction completed in 1902)."], ["„", "“Shanhaikwan-Newchwang Railway Loan Agreement” signed by British and Chinese Corporation, Ltd. and China (Oct. 10.)."], ["1899", "Russia and Great Britain exchange “Notes regarding Railway Interests in China” (April 28)."], ["„", "Exchange of “Notes between Russia and China with regard to Railways Northward and North-eastward from Peking” (June 17)."], ["„", "By an Imperial order Russia announces to create Dalny a free port (August 11)."], ["„", "John Hay proposes ‘Open Door’ in China (Sept.-Nov.)."], ["1900", "The Boxer Rebellion."], ["1902", "Agreement relating to China and Korea reached between Japan and Great Britain (Jan. 30) (“First Anglo-Japanese Alliance”)."], ["„", "Convention between Russia and China in regard to Manchuria signed (April 8)."], ["„", "Re-establishment of Chinese authority in Manchuria and evacuation of Manchuria by Russia agreed. (Russia fails, however, to carry out her promise)."], ["„", "Second Anglo-Japanese Alliance concluded (Aug. 12)."], ["1904-5", "Russo-Japanese War."], ["1905", "“Treaty of Portsmouth” concluded between Japan and Russia (Sept. 5)."], ["", "(By the Treaty, (1) China’s sovereignty in Manchuria was recognized, Russia transferred to Japan, with the consent of China, the lease of Port Arthur, Dairen, and adjacent territory and territory waters, together with all rights, privileges, and concession with or forming part of this lease; (2) Russia transferred to Japan the railway between Changchun and Port Arthur and its branch lines, together with all rights, privileges and properties appertaining thereto.)"], ["„", "Japan concluded the “Treaty of Peking” with China in conformity with the terms of the Portsmouth Treaty (Dec. 22), and obtains the consent of China to the transfer by Russia of the lease, privileges, and properties mentioned in the Treaty of Portsmouth, and also the right of maintaining, improving and operating the railway line between Mukden and Antung, which was constructed by Japan during the war."], ["„", "E. H. Harriman proposes to purchase the South Manchuria Railway, but the proposal was rejected by Japan."], ["1906", "By an Imperial Ordinance the Organization of the South Manchuria Railway Company proclaimed (June 7)."], ["„", "Japan announces the organization of the Kwantung Government-General in the Kwantung Leased Territory (July)."], ["1907", "“Loan agreement regarding Mukden-Hsinmintun and Changchun-Kirin Railways” concluded between Japan and China (April 15)."], ["„", "“Agreement regarding Establishment of Maritime Customs Office at Dairen” signed by Japan and China (May 30)."], ["„", "“Political Convention” between Japan and Russia concluded (July 30)."], ["„", "Question of ‘parallel line’ arises regarding China’s proposal to build Hsinmintun-Fakumen Railway in co-operation with a British firm of contractors, Pauling & Co. Japan twice protests on the ground that the project contradicts the ‘protocol’ attached to the Peking Treaty of 1905. (The matter dragged on till 1909, when China dropped the scheme)."], ["„", "The United States attempts to acquire the right to establish a Manchurian Bank with a capital of $10,000,000, with view to financing the railway, connecting Hsinmintun and Aigun. The project, however, fails owing to political changes in China."], ["1908", "Agreement reached between Great Britain and China in regard to Shanhaikwan-Hsinmintun section of Peking-Mukden Railway (March 25)."], ["„", "“Regulations for Sino-Japanese Joint Stock Lumber Company for Exploitation of Yalu Timber” announced. (Sept. 11)."], ["„", "“Supplementary Loan Agreement for Hsinmintun-Mukden and Kirin-Changchun Railways” signed (Nov. 12)."], ["„", "“Exchange of Notes declaring Policy in Far East.” (So-called “Takahira-Root Agreement”) (Nov. 30)."], ["1909", "Russia and China sign “Preliminary Agreement in regard to Municipal Administration in the C.E.R. Zone” (May 10)."], ["„", "“Detailed Agreement regarding Loans for Hsinmintun-Mukden and Changchun-Kirin Railways signed (Aug. 18)."], ["„", "Japan and China conclude the “Agreement concerning Mines and Railways in Manchuria,” and “Agreemnt relating to Chientao Region.” (Sept. 4). (By the former agreement it was decided that China should previously arrange with Japan in the event of her undertaking to contract a railway between Hsinmintun and Fakumen, that China should recognize the Tashichiao-Yingkow line as a branch line of the S.M.R., that China should recognize the right of Japan to work coal mines of Fushun and Yentai, that all mines along the Antung-Mukden Railway and the main line of the S.M.R., excepting those at Fushun and Yentai, should be exploited as joint enterprises of the Japanese and Chinese, and that Japan should agree to the extension of the Peking-Mukden Railway to the city wall of Mukden. And by the latter agreement the long disputed boundaries between China and Korea was fixed along the Tumen River, and Koreans were given the right to settle freely and own land in the Chientao district."], ["„", "“Preliminary Agreement for Chinchow-Aigun Railway” signed between Pauling & Co. of Great Britain, American group of financers, and the Chinese Government. (Oct. 2). (Russia opposed the plan and Japan claimed participation. The question was submitted ultimately to the New Four-Power Consortium by America)."], ["„", "Secretary Knox of the United States proposes to internationalize the railways in Manchuria. (Dec.) (Russia and Japan opposing the scheme, sent their replies simultaneously to the United States, rejecting the proposal)."], ["1910", "“Second Russo-Japanese Convention” concluded (July 4) in view of protecting their common interests in Manchuria against a third Power."], ["„", "Amalgamation of Korea and Japan (Aug. 29)."], ["„", "By a preliminary agreement the United States acquires right to loan for currency reform and industrial development in China."], ["1911", "“Chinese Currency Reform and Industrial Development Loan Agreement” signed by China and Four Powers’ Consortium (April 15), the United States agreeing to give up the right, which she acquired in the preceding year, to the Consortium."], ["„", "Third Anglo-Japanese Alliance concluded (July 13)."], ["1911-12", "Revolution in China, the Manchu dynasty overthrown and China becomes a Republic."], ["1912", "Yuan Shi-kai proclaimed President of China."], ["„", "“Russo-Mongolian Agreement” signed (Nov. 3)."], ["1913", "Japan and China exchange “Notes regarding Construction of certain Railways in Manchuria” (Oct. 5), and in consequence, Japan acquires the right to loan for the construction of five railways, namely (1) Ssupingkai-Chengchiatun-Toanan, (2) Kaiyuan-Hailung, (3) Changchun-Taonan (4) Taonan-Jehol, and (5) Hailung-Kirin lines. For the first three railways China is to ask loan from Japan and for the last two she is to consult Japanese financers first."], ["„", "Russia and China issue “Declaration in regard to Outer Mongolia” (Nov. 5)."], ["1914-1918", "The Great War."], ["1915", "“Treaty, and Exchange of Notes, respecting South Manchuria and Eastern Inner Mongolia” (May 25). (By this Treaty the term of lease of Port Arthur and Dalny and the terms of the S.M.R. and Antung-Mukden Railway were extended to 99 years, namely, the definite time for the expiration of the terms of lease became 1997 for the Kwantung Leased Territory, 2002 for the S.M.R. and 2007 for the Antung-Mukden Railway. Secondly, the Japanese acquired right to lease land by negotiation in South Manchuria. Thirdly, the Japanese acquired rights to reside and travel freely in South Manchuria and to engage in business and manufacture of any kind, and fourthly the Chinese government agreed to give permission to Japanese and Chinese who desire to undertake agricultural enterprises jointly)."], ["„", "Russia, China and Mongolia sign “Tripartite Agreement regarding Outer Mongolia (June 7)."], ["„", "Russia and China conclude “Arrangement concerning Situation of Hulunbuir (Hailar) (Nov. 6), Russian position in North Manchuria strengthened."], ["„", "Yokohama Specie Bank and China conclude “Loan Agreement for Ssupingkai-Chengchiatun Railway (Dec. 27)."], ["1916", "Chang To-lin becomes Military and Civil Governor of Fengtien Province."], ["„", "Yuan Shih-kai attempts to restore monarchy."], ["„", "“Convention in regard to Co-operation in the Far East” concluded between Japan and Russia (July 3)."], ["„", "Chengchiatun Incident."], ["1917", "Japan and China exchange “Notes regarding Settlement of Chengchiatun Affair, Employment of Japanese Military Advisers and Instructors, Establishment of Japanese Police Stations in South Manchuria and Eastern Inner Mongolia, and withdrawal of Japanese Troops from between Ssupingkai and Chengchiatun (Jan. 28)."], ["„", "South Manchuria Railway Co. and China sign “Agreement for Kirin-Changchun Railway Loan” (Oct. 12)."], ["„", "Japan and the United States exchange “Identic Notes regarding Mutual Interests relating to China (Ishii-Lansing Agreement)” (Nov. 2), the principle that ‘territorial propinquity creates special relations between countries’ accepted."], ["1918", "“Preliminary Agreement for Kirin-Kainei Railway Loan” concluded between Japanese banks and China (June 18)."], ["„", "“Agreement for Loan for Gold Mining and Forestry in Heilungkiang and Kirin” signed by Japanese banks and China (Aug. 2)."], ["„", "Japan and China exchange “Notes regarding Four Railways in Manchuria and Mongolia” (Sept. 24)."], ["„", "“Contract for Loan for Four Railways in Manchuria and Mongolia” signed by Japanese banks and China (Sept. 28)."], ["1918-22", "Allied intervention in Siberia."], ["1919", "Imperial Ordinance of Japan regarding the Organization of the Government of Kwantung issued (April 12)."], ["„", "Karakhan issues Soviet “Declaration to the Chinese Nation and the Governments of the Southern and Northern China” (July 25)."], ["1920", "The New Consortium formed (Oct. 15)."], ["„", "“Second Soviet Declaration on policy towards China” (Oct. 27)."], ["1921-22", "Washington Conference."], ["1922", "First Mukden Chihli War. Declaration of independence of the Three Eastern Provinces."], ["„", "Japanese delegate to the Washington Conference announces that Japanese capital, which has had the monopoly of loans for construction of railways in South Manchuria and Eastern Inner Mongolia and of loans having for security the taxes in that region, is willing to forego this monopoly and open the field to the enterprise of the International Financial Consortium, and that Japan has no intention of insisting on a preferential right in the engagement of foreign advisers or instructors by China on political, financial, military, or police matters in South Manchuria (Feb. 2)."], ["„", "“Nine Power Treaty regarding to Principles and Policies to be followed in matters concerning China” signed (Feb. 6). Principle of ‘Open Door’ affirmed formally by the treaty, and the Powers other than China agree: (1) To respect the sovereignty, the independence, and the territorial and administrative integrity in China; (2) To provide the fullest and unembarrassed opportunity to China to develop and maintain for herself an effective and stable government; (3) To use their influence for the purpose of effectually establishing and maintaining the principle of equal opportunity; and (4) To refrain from taking advantage of conditions in China in order to seek special rights or privileges."], ["1923", "China requests nullification of the Treaty of 1915, but Japan refuses. (March 10)."], ["„", "Japan and the United States exchange “Note in regard to Cancellation of Ishii-Lansing Agreement” (April 14)."], ["1924", "“Agreement on General Principles for the Settlement of the Question between the U.S.S.R. and the Republic of China” signed (May 31)."], ["„", "“Agreement for the Provisional Management of the Chinese Eastern Railway” signed (May 31)."], ["„", "Agreement between the Government of the Autonomous Three Eastern Provinces of the Republic of China and the Government of the U.S.S.R., concerning Mutual Rights and Principles” signed at Mukden (Sept. 20). The main features of this Agreement are as follows: (1) The Soviet Union recognizes that the C.E.R. is a purely commercial enterprise, (2) In the management of the Railway, the two countries are equally represented, (3) After the expiration of sixty years from August 27, 1896, instead of eighty years, as formerly provided, the railway shall pass by reversion without payment into Chinese possession. China may recover the railway at any time upon paying, with her own capital, the price agreed upon by the two governments. (4) Both parties agree that the future of the C.E.R. shall be determined by the U.S.S.R. and China to the exclusion of any third party or parties. (5) The two governments recognize equal rights of navigation on border rivers, and maintenance of the present border line, and also agree not to engage in propaganda directed against the political and social systems of the other contracting party."], ["„", "Second Mukden-Chihli War."], ["„", "Commander-in-Chief of Kwantung Army issues a statement on the attitude of Japanese military authorities in Manchuria in regard to maintenance of peace and order in that region, (Oct. 30)."], ["1925", "Third Mukden-Chihli War."], ["„", "Contract for construction of Kirin-Tunhwa Railway concluded between the S.M.R. Co. and China, (Oct. 24)."], ["„", "Revolt of Kuo Sung-ling (Nov.-Dec.)."], ["„", "Japan issues announcement on her attitude towards political disturbances caused by the revolt of Kuo Sung-ling, (Dec.)."], ["1926", "Mukden Forces enter Peking (June)."], ["„", "Hulan-Hailun Railway partly completed (July)."], ["„", "Taonan-Angangki Railway partly opened to traffic (July)."], ["„", "Chiang Kai-shek, Commander-in-Chief of the Nationalist Army issues declaration of ‘Northern Expedition’ (July 9)."], ["„", "Peking Government demands recall of Soviet Ambassador (Aug. 30)."], ["„", "Chang Tso-lin appointed Commander-in-Chief of the Ankuochun (Dec. 1) and enters Peking (Dec. 27)."], ["1926-28", "The National Revolution."], ["1927", "Nanking occupied by Nationalist Forces (March)."], ["„", "Raid of Soviet Embassay at Peking (April 6)."], ["„", "Contract for construction of Kirin-Tunhwa Railway revised (May 20)."], ["„", "Contract for construction of Taonan-Solun Railway concluded between Japan and Peking government (May 20)."], ["„", "Chang Tso-lin appoints himself Grand Marshal (June 18)."], ["„", "Japan despatches troops to Shantung (June-July)."], ["„", "Mukden-Hailung (Chaoyangchen) Railway completed (Sept.)."], ["„", "Tahushan-Tungliao Railway completed (Oct.)."], ["1928", "Clash between Japanese and Chinese troops at Tsinan (May)."], ["„", "Contract on construction of four railways, namely: Yenchi-Hailin Tunhwa-Laotoukou, Laotoukuo-Tumen and Changchun-Talai concluded between Japan and Peking Government (May 13-15)."], ["„", "Japan sends note to Chinese generals and announces her intention to take, if necessary, ‘appropriate, effective steps for the maintenance of peace and order in Manchuria’ (May 18)."], ["„", "Chang Tso-lin retreats from Peking and meets an unexpected death (June 4). Chang Hsueh-liang succeeds his father."], ["„", "Construction of Kirin-Tunhwa Railway completed (Aug.)."], ["„", "Independence movement in Barga (Sept.-Oct.)."], ["„", "Construction of Hulan-Hailun Railway completed (Dec.)."], ["„", "Mukden Government orders the Three Eastern Provinces to hoist Nationalist flag (Dec. 29)."], ["1929", "North-Eastern Political Committee formed, and the Three Eastern Provinces become formally under the authority of Nanking (Jan. 9)."], ["„", "Fengtien province renamed Liaoning province (Feb. 5)."], ["„", "Kirin-Hailung (Chaoyangchen) Railway completed (May)."], ["„", "Sino-Soviet conflict over Chinese Eastern Railway (May-Dec.)."], ["„", "Chinese raid on the Russian consulates at Harbin (May 27)."], ["„", "Chinese arrest the Russian manager of the C.E.R. and others (July 10)."], ["„", "Reminder sent to the U.S.S.R. and China about the Kellogg Pact (Dec.)"], ["„", "Khabarovsk Protocol signed (Dec. 22) re-establishing the ‘status quo ante’ on the Chinese Eastern Railway."], ["1930", "Sino-Soviet conference on the C.E.R. affairs."], ["„", "War between Yen Hsi-shan and Chiang Kai-shek (Feb.-Sept..)."], ["„", "“Sino-Japanese Customs Tariff Agreement” signed (May 6)."], ["„", "Chang Hsueh-liang intervenes between the Northern Army under Yen Hsi-shan and Feng Yu-hsiang, and National Government (Sept. 18). The Mukden troops enter Peking (Sept. 21)."], ["1931", "Clash between Japanese and Chinese soldiers at Liukiaokou, and Japanese troops occupy Mukden and Kuanchengtzu. China appeals to the League of Nations for mediation of the Manchurian Incident (Sept.) Chief Secretary Drummond advices Japan and China not to enlarge the situation. The Council of the League of Nations decides to invite observers. Nanking Government demands Japan to evacuate the troops from Manchuria (Oct.) Clash between Japanese and Chinese Armies at Nanking. Briand, Chairman of the League Council, advices Japan and China to stop the disputes. Japanese Army enters Tsitsihar. Nanking Government demand Japan again to evacuate her troops (Nov.) Tsang Shih-Yi appointed Mayor Mukden. Heilungkiang Province declares independence (Dec.)."], ["1932", "Japanese troops enter Chinchow. New Heilungkiang Provincial Government established. Chang Hai-peng plans to establish a new independent state in Manchuria (Jan.) Japanese Army attacks the Ting Chao troops and enters Harbin."], ["", "The League Commission of Inquiry arrives at Tokyo (Feb.) Proclamation of Independence of Manchoukuo. Pu Yi appointed Chief Executive of Manchoukuo. Changchun made capital of Manchoukuo and name is changed to Hsinking (Mar.) Declaration of Customs Tariff Autonomy of Manchoukuo (June). Ting Chien-hsiu visits Japan as special envoy of Manchoukuo. Ma Chan-shan defeated and escapes (July). General Muto, Japanese Ambassador and Envoy Plenipotentiary to Manchoukuo arrives at Mukden (Aug.) Japanese recognition of Manchoukuo. Japan-Manchoukuo Protocol signed. The Lytton Report released. Japanese Army enters Tunghua (Oct.) Japanese Army enters Chalantun (Nov.) Japanese Embassy located at Hsinking."], ["1933", "Manchoukuo protests against Chang Hsueh-liang. Chinese Government issues a project against Japan on the Shanhaikwan Incident (Jan.) Japan-Manchoukuo Army makes expedition to Jehol. Japanese Army occupies Chaoyang (Feb.) Japanese Army occupies Chihfeng and Lingyuan, Luanping and Kupehkou (Mar.) Japan-Manchoukuo Agreement on Leasehold Privileges signed. The Investigation of Manchoukuo Constitutional Law begins. China charges high rate tax on the goods imported from Manchoukuo. Ambassador Muto dies. Manchoukuo’s New Currency system (M¥) adopted. (July). The Anniversary of founding of Manchoukuo celebrated (Sept.). Shanhaikwan incorporated in Manchoukuo formally (Nov.)."], ["1934", "The Imperial Regime adopted. Chang Hsueh-liang appointed Commander of Bandits Suppression Army of Honan, Hupei and Anwei Provinces (Jan.). Pu Yi rises to the throne of the Emperor of Manchoukuo. New Organization Law of Government issued (Mar.). General Hishikari appointed second Japanese Ambassador to Manchoukuo. Pope recognizes Manchoukuo . The Orchid Flower decided upon as the Imperial Crest of Manchoukuo (Apr.). Recognition of Manchoukuo by Salvador (May). H.I.H. Prince Chichibu as Imperial proxy visits Manchoukuo carrying message to the Emperor of Manchoukuo from the Emperor of Japan."], ["", "The negotiation for purchasing the Chinese Eastern Railway reaches a deadlock. The Manchoukuo customs house at Kupehkou opened (July). Russo-Manchoukuo Water Routes Agreement signed (Sept.). Manchoukuo Local Administration system proclaimed. Japanese Administrative Organ in Manchoukuo established (Oct.). General Minami appointed Commander of Kwantung Army. The Circulation of Hsien Tayuan prohibited (Dec.)."], ["1935", "The postal routes between Manchoukuo and China reopened. (Jan.). Japan-Manchoukuo Customs Tariff Agreement signed (Feb.). Convention for Purchasing the Chinese Eastern Railway signed (Mar.). H.I.H. the Emperor of Manchoukuo visits Japan. State Monopoly Petroleum Law issued. The Message of friendship from the president of Dominican Republic arrives (Apr.). Preparatory Convention between Manchoukuo and Outer Mongolia begins at Manchouli (May). Grand Naval Review in commemoration of the enthronement of the Emperor held on the Sungari. Exchange of postal money orders between Manchoukuo and Germany begins. Abolition of extra-territoriality decided upon to be enforced from July of following Year (Nov.)."], ["1936", "Abolition of North Manchuria Special District (Jan.). Japanese troops defeat the Outer Mongolian Army invading the frontier and destroy eight airplanes (Mar.). East Hopei Autonomous Government sends a special envoy for friendly relation to Manchoukuo. Manchoukuo undertakes to make research on the East frontier. Major-General Itagaki appointed Chairman of Japan-Manchoukuo Joint Economic Commission. Manchoukuo-Germany Trade Convention signed (Apr.) Soviet-Manchoukuo Water Routes Technical Committee held at Blagoveschensk (May). The Overseas Department of Japan decides to send 5,000 families to Manchoukuo as immigrants from the following year. Japan-Manchoukuo Treaty for Protection of Industrial Properties signed (June). Manchuria Development Company established. The Treaty on Postal Affairs between Japan and Manchoukuo signed (Dec.). Japan-Manchou Social Works Association established (Sept. 12). The Memorial Tower to the Japanese Soldiers at Harbin unveiled (Sept. 23). Sino-Japanese Air Routes Through Traffic Agreement signed (Oct. 17). Dr. Knoll appointed German Trade Representative to Manchoukuo (Nov. 24)."], ["", "Anniversary of East Hopei Autonomous Government (Nov. 25). Prime Minister Chang Ching-hui issues the statement on the Japan-German Anti-Communist Agreement (Nov. 26). Italian Consulate-General permitted to be located at Mukden (Dec. 1). Japan-Manchoukuo unification of time (Dec. 5). Match Monopoly Law promulgated (Dec. 20). Salt Monopoly Law proclaimed (Dec. 24). The Manchurian Affairs Board of Japan issues the statement on Manchoukuo Industrial Development plan. New Manchoukuo Post Law promulgated (Dec. 26)."], ["1937", "Conference of Provincial Governors held (Jan. 22). Imperial Throne Succession Law promulgated. Lieut.-General Tojo succeeds Lieut-General Itagaki and oppointed Chief of the Staff of Kwantung Army (Mar. 1). Imperial Property Administration Law proclaimed. Dr. Knoll arrives at Hsinking (Apr. 1). Sino-Japanese Hostilities Break Out at Lukowchiao in the outskirts of Peking (July 7). Agreement reached to entrust heavy industries of Manchoukuo under supervision of the S.M.R. Company to the Nippon Sangyo Company (Manchuria Industrial Development Corporation) (Nov. 1)."], ["1938", "Germany extends de jure recognition to Manchoukuo (Feb. 20). National Mobilization Law promulgated (Feb. 26). 5-year industrial plan revised (May 14). Japan-Manchoukuo-Italy Commercial Treaty and Manchoukuo-Italy Commerce & Navigation Treaty concluded (July 5). Manchoukuo-Germany Foreign Trade Agreement concluded (Sept. 14). Manchoukuo declaration of cooperation with Konoe statement in China policy (Dec. 22)."], ["1939", "Hungary extends de jure recognition to Manchoukuo (Jan. 10.) Participation in Anti-Comintern Agreement declared by Premier Chang. (Jan. 16). Manchoukuo-Hungary Anti-Comintern Pact concluded (Feb. 24). First Nomonhan Incident breaks out (May 11). 2nd Nomonhan Incident breaks out (June 17). Nomonhan Armistice treaty concluded (Sept. 15)."], ["1940", "The New National Army Law promulgated (Apr. 11). Revised Japan-Manchoukuo Commercial Pact concluded (June 26). The Emperor pays formal visit to Tokyo (June 26). Establishment of Chienkou Shrine in Imperial Palace (July 15). Provincial Census Registration Act promulgated (Aug. 1.). New Manchoukuo-Reich Trade Agreement signed (Sept. 12). Temporary National Census compilation commenced (Oct. 1). Japan-Manchoukuo-China Joint Declaration on establishing East Asia Co-prosperity Sphere announced (Nov. 30). Roumania extends de jure recognition to Manchoukuo (Dec. 4). Results of Provisional Census published. (Population of Manchoukuo 43,000,000 standing on Oct. 1) (Dec. 25)."], ["1941", "2nd Coal production expansion plan decided (Feb. 5). Lu Yung-huan appointed Ambassador to Nanking (Jan. 15). Newly appointed Chinese Ambassador to Manchoukuo Lien Yu arrives at Hsinking (Feb. 23). Japan-Manchoukuo-China communications unifying policy decided (Feb. 24). Teh Wang pays formal visit to Tokyo (Feb. 24). Roosevelt orders freezing Japanese assets in U.S.A. (Mar. 3). Wool production increasing plan decided (Mar. 4). Manchuria Development Co. amalgamates Manchuria-Chosen Development Co. (Apr. 1). Copper production encouragement rule promulgated (Apr. 1). Manchoukuo Iron Ore development plan decided (Apr. 4). Industrial Promotion Loan Law promulgated (Apr. 17). Manchuria Development Co. increases capital by ¥15,000,000 (Apr. 23). Japan-Manchoukuo-Germany Trade Conference held (Apr. 29). Manchoukuo Investment Securities Co. (capital ¥400,000,000) established (Apr. 29). Bulgaria extends de jure recognition to Manchoukuo (May 14). Japan and U.S.S.R. exchange ratifications of Neutral Pact (May 20). Manchoukuo-Germany Trade Pact to be effective another 5 months (May 31). Manchoukuo Army receives first conscripted soldiers (June 1). The Emperor makes inspection tour to Northwest district (June 2). Spain establishes legation in Manchoukuo (June 4). Japan-Manchoukuo Economic Conference held (June 9). Wang Ching-wei pays formal visit to Japanese Capital (June 17). Manchoukuo Wool Co. established (June 22). Ssuping Province newly established (July 1). Finland extends de jure recognition to Manchoukuo (July 21). Freezing British and American assets in Manchoukuo ordered (July 28). Commodity Price Suspending Law promulgated (July 29). Foreign Exchange Law revised (Aug. 1). Manchoukuo extends de jure recognition to Croatia (Aug. 2). Manchuria Ceramic Wares Co. established (Aug. 5). Thailand extends de jure recognition to Manchoukuo (Aug. ). Manchoukuo-Outer Mongolia Joint Communique on Nomonhan Frontier Regulation announced (Aug. 20). Suifeng Dam of Yalu River completed (Aug. 25). Denmark extends de jure recognition to Manchoukuo (Aug. 27). British subjects in Japan and Manchoukuo decide to leave (Aug. 30). Automobile Transportation Industries Law promulgated (Sept. 1). 2nd 5 year Industrial Plan fundamental principles established (Sept. 2). 2nd Provincial Governors’ Conference held (Sept. 5). Japan-Manchoukuo Joint Committee’s Conference held (Sept. 9). 1st Enshrinement Rites of Kienkuo Chunyu Miao (Shrine deifying the war-dead in the establishment of Manchoukuo) held (Sept. 17). Treaty of Amity, Commerce and Navigation signed between Manchoukuo and Spain. (Sept. 18). Joint declaration is made by the Manchoukuo & Outer Mongolia Governments regarding settlement of border demarcation. (Oct. 15)"]]}], "footnotes": [], "transcriber_notes": ["Laid out as a two-column year/event list (year in a hanging left column), so transcribed as a table. Each row is one printed entry; line-end hyphenations have been joined (e.g. 'con-nects' -> 'connects').", "'„' in the Year column is the printed ditto mark (same year as above).", "Rows with an empty Year cell: no year or ditto mark is printed for these entries/paragraphs: 1898 'Russia obtains twenty-five years' lease ...' (p.106); the '(By the Treaty, (1) ...)' paragraph after the 1905 Portsmouth entry (p.107); the second 1932 paragraph 'The League Commission of Inquiry ...' (p.113); the 1934 paragraph 'The negotiation for purchasing ...' (p.114); the 1936 paragraph 'Anniversary of East Hopei ...' (p.114).", "Entries that run across page breaks are joined into one row: Yokohama Specie Bank entry (pp.109-110), Nine Power Treaty entry (pp.110-111), 1934 (pp.113-114), 1937 (pp.114-115), 1941 (pp.115-116). The year 1898 is printed again at the top of p.107, so it appears twice in the Year column, as printed.", "Printed spellings, misprints kuo."], ["(2) Visé on a passport for transit", "Non-existent. Visé on passport for entry uniformly applied.", "This regulation has been newly provided for the convenience of travellers in transit at the cheaper fee of M¥2."], ["(3) Certificate of Preconsent to a visé", "Non-existent.", "This has been newly provided to ensure a prompt and simple visé and for the convenience of travellers at their discretion."], ["(4) Visé fees for entering Manchoukuo", "Collected according to the principle of reciprocity, to wit: (Fees vary according to exchange rates.) For British subject: about Fourteen (14) Yuan For American: about Fifty-one (51) Yuan For Frenchman: about Ten (10) Yuan", "Ten (10) Manchoukuo Yuan shall be charged uniformly from every nationality."], ["(5) Visé fees for leaving the national border", "", ""], ["In North Manchuria", "1. In the case of a national of a treaty-power For one way within a province: One (1) Yuan For a return trip within the province: Two (2) Yuan For one way outside a province: Two (2) Yuan For return trip outside the province: Four (4) Yuan When leaving Manchuria: Four (4) Yuan", "Abolished."], ["", "2. In the case of a national of a non-treaty power or person without nationality For one way to the interior: Nine (9) Yuan For a return trip to and from the interior: Seventeen (17) Yuan When leaving Manchuria: Eight (8) Yuan", "Abolished."], ["In South Manchuria", "1. In the case of a national of a treaty-power For one way to the interior: Two (2) Yuan For a return trip to and from the interior: Four (4) Yuan For one way out of Manchuria: Four (4) Yuan For a return trip out of Manchuria: Eight (8) Yuan", "Abolished."], ["", "In the case of a national of a non-treaty power or person without nationality (The collection of fees suspended temporarily since the Incident of September 18, 1931.) For one way to the interior: Two (2) Yuan For a return trip to and from the interior: Four (4) Yuan For one way out of Manchuria: Four (4) Yuan For a retu
