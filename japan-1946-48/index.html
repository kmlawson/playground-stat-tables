eras in Japan]", "caption_extra": "Geological Formation", "continued": false, "parts": [{"label": null, "columns": ["Rocks", "Sq. km.", "%"], "rows": [["Archæan stratum", "14,189", "3.40"], ["Palæozoic stratum", "53,149", "12.73"], ["Mesozoic stratum", "29,844", "7.15"], ["Neozoic stratum", "196,079", "46.98"], ["Tertiary vomitted rocks", "44,157", "10.58"], ["Quaternary vomitted rocks", "79,970", "19.16"], ["Total", "417,388", "100.00"]]}], "footnotes": [], "transcriber_notes": ["'stratum' is printed once, on the Archæan row, and repeated with ditto marks (\") for Palæozoic, Mesozoic and Neozoic; expanded here.", "Table begins at the foot of the left column and continues at the head of the right column.", "Total Sq. km. 417,388: parts sum to 417,388 — reconciles.", "Total % 100.00: parts sum to 100.0 — reconciles."], "id": "p0048_1", "scans": [{"label": "scan leaf 48", "url": "https://archive.org/details/japan-year-book-1946-1948/page/n48/mode/1up"}]}, {"image": "p0049", "images": ["p0049", "p0050"], "printed_pages": ["12", "13"], "chapter": "Geography", "table_no": null, "title": "[Volcanic chains of Japan]", "caption_extra": "Volcanic Chains. According to the Geological Research Office, the total number of volcanoes in Japan is 192, of which 58 are active. They may be grouped in 11 chains:", "continued": false, "parts": [{"label": null, "columns": ["No.", "Chain (as printed)"], "rows": [["(1)", "The north Japan inner, or Chokai, volcanic chain, which starts at the south-western offing of Hokkaido, or O-shima and Ko-jima, and runs through Iwaki-yama, Kampuzan, Moriyoshi-yama Chokai-san, ending with Gassan."], ["(2)", "The south Japan inner, or Hakusan, volcanic chain, extending from Hakusan along the Japan Sea to the west through Daisen, Mitsubé-yama, Aono-yama and other smaller volcanoes and then to the Goto Islands of Kyushu."], ["(3)", "The Hokkaido volcanic chain, which links such mountains as Hakodaté-yama, Komaga-daké, Tarumayé-daké and some islands in the peninsular part of western Hokkaido."], ["(4)", "The north Japan central, or Nasu, volcanic chain, including Osoré-yama, Hakkoda-san, Towada Lake, Iwaté-yama, Komaga-daké, Kurigoma, Numasawa, Arao, Funagata, Za-oh, Bantai, Azuma, Adatara, Nasu, Nantai, Shirané, Akagi, Haruna, Tsuno-otoshi and Arafuna, which are mostly active volcanoes."], ["(5)", "The Hida volcanic chain, composed of the seven volcanoes of Hera-daké, Taté-yama, Ko-tombi, Washiba-daké, Iwo-daké, Norikura-daké and On-také."], ["(6)", "The Mikasa volcanic chain, to the west of the Hida volcanic chain, beginning with Horaiji-san, of Aichi prefecture, and running westward to O-hara-yama, Mikasa-yama, Miminari-yama, Futakami-san and Kabuto-yama of Hyogo prefecture."], ["(7)", "The Seto, or Inland Sea, volcanic chain, embracing the old volcanic mountains along the coasts of the Inland Sea and extending to Kyushu, including such mountains as Futako, Kokonoyé, Yufu, Onsen and Tara. The volcanoes are all dormant."], ["(8)", "The Ryukyu volcanic chain, starting with the Aso volcano, taking in Kirishima, Sakurajima and Kaimon and extending to the Ryukyu Islands, where it connects Iwojima, Kuchino-Irabé-jima, Kuchinosé, Nakano-jima, Suwanosé, Waruiwa-jima, Tori-shima and Aguni-shima."], ["(9)", "The amphibolite andesite volcanic chain, which connects Aono-yama of Shimané prefecture and Tokusa of Yamaguchi, appears then in Kimpo-zan and Shiguma-daké near Tokuyama, and Himé-jima of Suo, meets with the Inland Sea chain and runs to Yufu, Kokonoé and a part of Aso, and extends as far as Luzon Island, sinking to the bottom of the ocean west of the Ryukyu Islands on the way and then running along the eastern coast of Formosa."], ["(10)", "The Fuji volcanic chain, which cuts across the heart of the Main Island from the coast of the Japan Sea to that of the Pacific Ocean, and continues to the Izu, Bonin, Sulphur, Mariana and Caroline Islands, including such mountains as Myoko, Togakushi-yama, Tateshina-yama, Yatsuga-daké, Fuji-san, Hakoné and Amagi on the Main Island."], ["(11)", "The Chishima volcanic chain, which comes into Hokkaido from the Chishima, runs along the Ezo mountain system, suddenly turns to the north and seems to disappear in Saghalin."]]}], "footnotes": [], "transcriber_notes": ["Numbered list set in running paragraphs; transcribed as a list, one row per chain, text verbatim with line-end hyphens removed.", "Items (1)–(2) on p. 12 (p0049), (3)–(11) on p. 13 (p0050)."], "id": "p0049_1", "scans": [{"label": "scan leaf 49", "url": "https://archive.org/details/japan-year-book-1946-1948/page/n49/mode/1up"}, {"label": "scan leaf 50", "url": "https://archive.org/details/japan-year-book-1946-1948/page/n50/mode/1up"}]}, {"image": "p0051", "images": ["p0051", "p0052"], "printed_pages": ["14", "15"], "chapter": "Geography", "table_no": null, "title": "Mountains", "caption_extra": "(Above 2,500 meters)", "continued": false, "parts": [{"label": null, "columns": ["Name", "Location", "Height (m.)"], "rows": [["Fuji", "Shizuoka", "3,773"], ["Kita", "Yamanashi", "3,192"], ["Manodaké", "Shizuoka", "3,189"], ["Yarigadaké", "Nagano", "3,180"], ["Akaishi", "Nagano", "3,120"], ["Okuhotaka", "Nagano", "3,103"], ["Higashimata", "Nagano", "3,095"], ["Shirané", "Nagano", "3,093"], ["Ontaké", "Nagano", "3,093"], ["Hotaka", "Nagano", "3,090"], ["Arakawa", "Shizuoka", "3,083"], ["Shiomi", "Shizuoka", "3,047"], ["Senjo", "Yamanashi", "3,033"], ["Minamidaké", "Nagano", "3,032"], ["Kitahotaka", "Gifu", "3,032"], ["Nootori", "Shizuoka", "3,026"], ["Norikura", "Gifu", "3,026"], ["Hijiri", "Shizuoka", "3,011"], ["Tsurugi", "Toyama", "2,998"], ["Tatéyama", "Toyama", "2,992"], ["Suisho", "Toyama", "2,977"], ["Komagadaké", "Yamanashi", "2,966"], ["Marishiten", "Gifu", "2,959"], ["Shirouma", "Toyama", "2,933"], ["Yakushi", "Toyama", "2,928"], ["Goro", "Toyama", "2,924"], ["Mae-Hotaka", "Gifu", "2,908"], ["Yari", "Toyama", "2,903"], ["Akadaké", "Nagano", "2,900"], ["Kasa", "Gifu", "2,897"], ["Kashima-Yari ording to public opinion"], ["(2)", "Men of upper and lower classes without distinction shall be united in all enterprises"], ["(3)", "Civil officials and military officers shall be in one accord and all the common people shall be so treated that they can attain their aims and feel no discontent"], ["(4)", "Old unworthy ways and customs shall be destroyed and the people shall walk along the highway of heaven and earth"], ["(5)", "Knowledge shall be sought among the nations of the world and the Empire shall be led up to the zenith of prosperity."]]}], "footnotes": ["“To accomplish this unprecedented reformation, We go before the people, and proclaim the fundamental national principles even in the presence of the gods of heaven and earth, to establish the way for the public welfare. Ye, Our subjects, shall be united all together, according to these principles.”"], "transcriber_notes": ["Numbered list run into the prose paragraph (items separated by semicolons); transcribed as a list per the 'lists count too' instruction. The closing paragraph of the oath is given in footnotes."], "id": "p0110_1", "scans": [{"label": "scan leaf 110", "url": "https://archive.org/details/japan-year-book-1946-1948/page/n110/mode/1up"}, {"label": "scan leaf 111", "url": "https://archive.org/details/japan-year-book-1946-1948/page/n111/mode/1up"}]}, {"image": "p0124", "images": ["p0124", "p0125", "p0126", "p0127", "p0128", "p0129", "p0130", "p0131", "p0132", "p0133", "p0134", "p0135", "p0136", "p0137", "p0138", "p0139", "p0140", "p0141", "p0142", "p0143", "p0144", "p0145", "p0146", "p0147", "p0148", "p0149", "p0150", "p0151", "p0152", "p0153", "p0154", "p0155", "p0156", "p0157", "p0158", "p0159", "p0160", "p0161", "p0162", "p0163", "p0164", "p0165"], "printed_pages": ["83", "84", "85", "86", "87", "88", "89", "90", "91", "92", "93", "94", "95", "96", "97", "98", "99", "100", "101", "102", "103", "104", "105", "106", "107", "108", "109", "110", "111", "112", "113", "114", "115", "116", "117", pleted."], ["1825", "Shogunate Order to shut out all foreign ships by force."], ["1830", "Great famine of the Tempo era."], ["1837", "Rebellion of Oshio-Heihachiro to relieve the starving masses."], ["", "Coming of the American ship “Morrison.”"], ["1841", "Roju Mizuno-Tadakuni's attempt at reformation."], ["1842", "The 1825 Order removed. A step toward opening the country."], ["", "Controversies between the antiforeign party and the liberalists."], ["1845", "Visit of American ships to Uraga."], ["1846", "First request of America for the “open door.”"], ["1848", "Casting of a European gun by Sakuma-Shozan."], ["1849", "Knocking at Japan's doors of British and American ships."], ["1853", "Arrival of the American fleet under Commodore Perry."], ["", "Visit of the Russian delegate Poutiatine to Nagasaki."], ["1854", "Conclusion of Amity Treaties with the United States, Great Britain and Russia."], ["", "Institution of the Sun Flag to symbolize Japan. (Sanctioned by the Government in 1870)."], ["1855", "Conclusion of Amity Treaty with Holland."], ["1856", "Arrival of the American envoy Townsend Harris."], ["1858", "Conclusion of Commercial Treaties with the United States, Great Britain, France, Russia and Holland."], ["1859", "The Ansei Coup d'Etat by the Tairo, Ii Kamonnokami (Naosuké)."], ["", "Ports of Yokohama, Hakodaté and Nagasaki opened."], ["1860", "Japan's envoy Niimi-Masaoki sent to the United States."], ["", "Tairo Ii assassinated."], ["1861", "The British Legation at Yedo attacked by the ronin."], ["1862", "Rise of the Anti-Shogunate movement."], ["", "The Namamugi Incident."], ["1863", "The Anti-Foreign Law. Attack on foreign ships at Shimonoseki and Kagoshima."], ["1864", "Battle at the Hamaguri gate of the Kyoto Imperial Palace."], ["", "Shimonoseki bombarded by a combined fleet of the United States, Great Britain, France and the Netherlands."], ["1865", "Imperial Sanction given to the treaties of 1858."], ["1865–1867", "Hostilities between the Shogunate  forces, May 29."], ["", "Japan recognizes the new Argentine Government headed by General P. Ramirez formed on June 7, June 11."], ["", "The 82nd Session of the Diet is convened, June 15."], ["", "An agreement pertaining to the retrocession to China of the International Settlement of Shanghai signed at Nanking, June 30."], ["", "Tokyo is made Tokyo Metropolis with the amalgamation of the prefectural and municipal administrative organs, July 1."], ["", "Premier Tojo's visit to Bangkok, July 3–5."], ["", "Ohtorishima (former Wake Island) is attacked by the American bombers, July 25."], ["1943", "The declaration of Independence of Burma and the conclusion of Japan-Burma Alliance, Aug. 1."], ["", "The Kuriles attacked by an American air unit, Aug. 12."], ["", "The complete abandonment of Kiska Island by the Japanese Army and Navy forces, Aug. 22."], ["", "The U.S. forces commence landing on New Guinea, Sept. 4."], ["", "The “Tei-A Maru” leaves Yokohama for the second exchange of Japanese and American people interned in the respective countries, Sept. 14."], ["", "A joint communique of the Japanese and German Governments on the continuous validity of the Tripartite Alliance of Japan, Germany and Italy, Sept. 15."], ["", "Recognition by the Japanese Government, Thailand and Manchoukuo of the new Republic of the Philippines, Oct. 15."], ["", "The exchange of Japanese and American nationals who were brought to Murmagao by the “Tei-A Maru” and the “Gripsholm” respectively completed, Oct. 19."], ["", "Formal recognition by the Japanese Government of the Provisional Government of Azad Hind (Free State of India), Oct. 23."], ["", "The conclusion of a Pact between the Japanese Government and the Nanking Government under Wang Ching-wei on Oct. 30."], ["1943", "A five-point joint declaration adopted by the so-called Assembly of Greater East Asiatic Nations, Nov. 6."], ["", "Japanese forces of 3,000 garrisoned on Tarawa and Makin Islands of the Gilbert Group make their last charge, , "The arrest of 59 high-ranking Japanese war crimes suspects including Prince Morimasa Nashimoto, Dec. 3."], ["1945", "The apprehension by Dec. 16 of nine additional high-ranking Japanese, including Prince Fumimaro Konoyé, Dec. 6."], ["1945", "General Tomoyuki Yamashita sentenced to death by hanging, Dec. 8."], ["1945", "Prince Fumimaro Konoyé ends his life by taking poison, Dec. 16."], ["1945", "The ending of Japanese government sponsorship and financial support of State Shinto, Dec. 16."], ["1946", "The Emperor renounces his divinity in the Imperial rescript, Jan. 1."], ["1946", "The Far Eastern Commission arrives in Japan, Jan. 9."], ["1946", "Sanzo Nozaka, noted Communist, returns to Tokyo, from Yenan, Jan. 13."], ["1946", "The Shidehara Cabinet completes its reshuffle, Jan. 13."], ["1946", "The public prostitution system of Tokyo is abolished, Jan. 15."], ["1946", "The Japanese government announces the scope of persons to be removed from public services in accordance with the January 4 SCAP directive Feb. 9."], ["1946", "The arrival of the U.S. Education Mission, headed by Dr. George I. Stoddard at Atsughi Airfield, Mar. 5."], ["1946", "The Revised Japanese Constitution Drafted announced by the Japanese government, Mar. 6."], ["1946", "The first shipment to America of Japanese silk (1,100 bales) from Yokohama, Mar. 19."], ["1946", "Lieutenant-General Masaharu Homma, former Supreme Commander of the Japanese Forces to the Philippines shot dead by a firing squad in a suburb of Manila, Apr. 2."], ["1946", "The first meeting of the Allied Council for Japan held at the Meiji Building, Tokyo, Apr. 5."], ["1946", "The report of the United States Education Mission on Japanese education submitted to General Douglas MacArthur, Apr. 7."], ["1946", "The first post-surrender general election in Japan, Apr. 10."], ["1946", "After a decade of oblivion, May Day is celebrated, May 1."], ["1946", "Twenty-eight Class-A war crimines suspects arraigned at the court of the International Tribunal for the Far East, May 3."], ["1946", "The former U.S. President Herbert Hoover arrives at Atsughi airfield from Korea to investigate the food condition in the Far East, May 5."], ["1946", "The arrival of General Dwight Eisenhower, Chief of the U.S. General Staff, in Tokyo, May 10."], ["1946", "Edwin Pawley, President Truman's special envoy on reparations, arrives in Tokyo, May 10."], ["1946", "Foreign Minister Shigeru Yoshida becomes the president of the Liberal Party, May 15."], ["1946", "Shigeru Yoshida, President of the Liberal Party, forms a new Cabinet, May 20."], ["1946", "Yosuke Matsuoka, former Foreign Minister and one of the 28 top-ranking Japanese officials accused as war criminals, dies, June 27."], ["1946", "The immediate abolition of Japan's peerage system with the enforcement of the new Constitution approved by the House of Representatives, Aug. 3."], ["1946", "Pope Pius XII places $20,000 at the disposal of Japanese churches for reconstruction of edifices destroyed during the war. One hundred and two Roman Catholic churches in Japan were destroyed and damaged, Aug. 8."], ["1946", "The resumption of the Antarctic whaling under SCAP permission, Aug. 20."], ["1946", "The U.S. State Department announces that Mrs. Elizabeth Gray Vining, 44, of Philadelphia, has been appointed tutor to Crown Prince Akihito, Aug. 29."], ["1946", "The dissolution of the Butokukai, or the Japan Martial Art Society, Sept. 13."], ["1946", "The dissolution of the big three “Zaibatsu,” the Mitsuis, Mitsubishis and Yasudas, announced by themselves, Sept. 30."], ["1946", "The Labour Relations Readjusttment Bill, previously adopted at the Diet goes into effect, Oct. 13."], ["1946", "The promulgation of the new Constitution, Nov. 3."], ["1946", "The Ministry of Education makes public a list of the Chinese ideographs recognised for current use, 1,850 in number, Nov. 6."], ["1946", "SCAP orders the Japanese Government to convert the whole assets of the ten big Zaibatsu interests, Aikawa, Asano, Furukawa, Iwazaki, Mitsui, Nakajima, Nomura, Okura, Sumitomo and Yasuda into national bonds inalienable for 10 years, Nov. 27."], ["1946", "The Holding Company Liquidation Commission designates twenty Japanese companies as holding companies, Dec. 3."], ["1946", "Miss Tamaki Uyemura, first Japanese civilian to visit the United States since Pearl Harbour received by President Truman, Dec. 5."], ["1946", "SCAP gives permission to the Japanese Government to sell surplus of the U.S. Forces subsistence stocks, consisting of $1,000,000 worth of medical apparatus, 1,200,000 pairs of socks, 100,000 trousers, 75,000 pounds of grease and 72,420 laundry soap, Dec. 16."], ["1946", "Large-scale demonstrative rallies against the Yoshida Cabinet staged in various parts of the Country. Dec. 17."], ["1946", "A great earthquake shakes Kinki, Shikoku and Kyushu districts, Dec. 21."], ["1946", "Japan's new school system established, Dec. 29."], ["1947", "Former Fleet Admiral Osami Nagano, who was Chief of the Naval General Staff during the Pacific War and one of the A-class war crimes suspects, dies of an acute form of pneumonia Jan. 5."], ["1947", "The SCAP issses an order prohibiting the general strike scheduled on February 1 of the Government and Public Workers' Union, Jan. 31."], ["1947", "The designation by the Holding Company Liquidation Committee of the 10 major zaibatsu, Mitsui, Iwasaki, Sumitomo, Yasuda, Asano, Okura, Nomura, Nakajima, Furukawa and Aikawa families, with their combined total securities of ¥1,165,000,000, Feb. 20."], ["1947", "The conversion rate of one American dollar military scrip to 50 yen announced, Mar. 11."], ["1947", "The conversion rates of military scrips of per one pound sterling, to ¥200, one Austrarian sterling to ¥160, and one rupee to ¥15 announced, Mar. 12."], ["1947", "In his letter addressed to Premier Yoshida General MacArthur calls attention to the Government's responsibility to adopt strong measures to readjust Japan's pe."], ["756", "Separation of the Saracen Empire."], ["800", "Charlemagne crowned Emperor of the Romans. Formation of the so-called Holy Roman Empire."], ["843", "Treaty of Verdun and 870 Treaty of Mersen. Marked important stages in the dissolution of Charemagne's dominions."], ["888", "The Count of Paris installed by the French."], ["890", "Alfred the Great divides England into three."], ["904", "Attack of Constantinople by the Russians."], ["962", "Otto I, the Great, crowned Roman Emperor. Revival of the Holy Roman Empire."], ["982", "Greenland discovered by the Northmen."], ["988", "Christianity introduced into Russia. The Russian Slavs henceforth came under the influence of the Greek Church and Byzantine civilization."], ["1054", "Rupture of the Greek and Roman Churches. Destroyed the religious unity of European Christendom."], ["1066", "Battle of Hastings. Resulted in the Norman Conquest of England."], ["1095", "Council of Clermont. Beginning of the crusades."], ["1122", "Concordat of Worms. A compromise arrangement between the Papacy and the Holy Roman Empire."], ["1169", "Beginning of the Conquest of Ireland by the Englanders."], ["1206–1227", "Conquests of Jenghis Khan. Brought a large part of western Asia and eastern Europe under Mongol sway."], ["1215", "Magna Carta. Defined the rights of Englishmen and inspired their later struggles for political liberty."], ["1271–1295", "Travels of Marco Polo. His narratives greatly increased the interest of Europeans in the Far East."], ["1275", "Model Parliament of Edward I. A regularly elected Parliament which for the first time included representatives of all classes of the English people."], ["1289", "Osman I becomes ruler of the Ottoman Empire."], ["1336", "Spread of Renaissance movements."], ["1348–1349", "Black Death in Europe. Hastened the decline of serfdom and the emancipation of the peasantry."], ["1378–1417", "The Great Schism. Weakened the spiritual supremacy of the Popes over western Christendom."], ["139 ch armies surrender, May 15."], ["", "German forces enter Brussels, while the Maginot Line is broken through by German forces at Sedan, May 17."], ["", "Italy's entry into the European War, June 10."], ["", "German forces enter Paris, June 14."], ["", "French army, surrenders to Germany, June 17."], ["", "Truce Agreement between Germany and France at Compiegne, June 22."], ["", "Truce between Italy and France, June 24."], ["", "Marshal Pétain assumes the position of the Head of France, July 12."], ["", "Chancellor Hitler proposes peace between Great Britain and Germany and Italy, July 19."], ["", "British Foreign Secretary Halifax rejects Hitler's proposal for peace, July 22."], ["", "German blitzkrieg intensifies over England, Aug. 10–27."], ["", "The Japan-Brazil cultural pact signed at Rio de Janeiro, Sept. 23."], ["", "President Roosevelt signs a proclamation prohibiting the export of scrap iron, steel and other iron materials to other than the western hemisphere and England, Sept. 26."], ["1940", "Chancellor Hitler and Premier Mussolini meet for the second time at the Brenner Pass, Oct. 4."], ["", "The U.S. State Department orders all Americans not engaged in pressing business in Japan, China, Manchuria French Indo-China and Hongkong to evacuate, Oct. 8."], ["", "President Roosevelt announces the American determination to fight the Tripartile Alliance, Oct. 12."], ["", "Beginning of the Greco-Italian war, Oct. 28."], ["", "President Roosevelt wins the presidential campaign over Wendell Willkie, Nov. 6."], ["", "Australia sends her first Minister, Sir John Greig Latham, to Tokyo, Dec. 20."], ["", "Henry Bergson, French philosopher, dies in Paris."], ["1941", "The American Congress passes the Lend-Lease Bill, Feb. 8."], ["", "Conclusion of the protocol between Thailand and French Indo-China concerning the settlement of the border dispute, Mar. 11."], ["", "German forces enter Belgrade, Apr. 13."], ["", "German and Italian forces press British forces at the Libyan front, Apr. 13."], ["", "Yugoslavia subjugated by Germany, Apr. 18."], ["", "Greek forces surrender to German and Italian forces, Apr. 23."], ["1941", "Josef Stalin, Secretary General of the Central Committee of the Communist Party, concurrently appointed President of Council of People's Commissars, May 6."], ["", "Armistice between Great Britain and Iraq, May 31."], ["", "President Roosevelt issues order to freeze the assets of European countries held in the U.S., June 14."], ["", "Germany and Italy declare war against the U.S.S.R. June 22."], ["", "Great Britain and the U.S.S.R. come to an understanding concerning their mutual aid in their war against Germany, July 12."], ["", "German forces occupy Smolensk, July 16."], ["", "The U.S.A. Government issues orders to “freeze” the Japanese assets held in that country, July 25."], ["", "The abrogation of the Commerce and Navigation Treaty between Great Britain and Japan of 1911 and the Commercial treaties between Japan and India and Burma of 1934 and 1937, July 26."], ["", "Dutch East Indies adopt similar economic measures with America concerning the transactions with Japan, July 28."], ["", "President Roosevelt and Premier Churchill meet on board the British Warship"], ["1941", "The Atlantic Charter proclaimed on board the Prince of Wales off the Canadian on August 14."], ["", "The United States, Britain, Australia, Canada, the Netherlands East Indies, Nicaragua, Costa Rica, Chungking and Cuba declare war on Japan, Dec. 8."], ["", "S.A. Lozovsky, Vice-Foreign Commissar of the U.S.S.R. reaffirms Soviet neutrality in relation to the Pacific War, Dec. 9."], ["", "Germany and Italy decide to wage war in concert with Japan against the United States and the British Empire, Dec. 11."], ["", "In Washington British Prime Minister Winston Churchill confers with President Roosevelt, Dec. 22."], ["1942", "The United States, Britain, the Soviet Union, Chungking, Canada and other Allied countries sign an agreement for no separate evering diplomatic relations with Germany, accepts the truce terms of the Soviet Union, Sept. 3."], ["1944", "The Soviet Union declares war on Bulgaria on Sept. 5."], ["1944", "British Prime Minister Winston Churchill confers with President Roosevelt at Quebec, Sept. 10."], ["1944", "Troops of the American 1st Army enter Luxemburg, Sept. 10."], ["1944", "The Quebec Conference, Sept. 12-16."], ["1944", "The severance of Finnish-Japanese relations, Sept. 22."], ["1944", "Wendell Willkie, Republican leader of the United States, succumbs at the age of 52, Oct. 8."], ["1945", "The proclamation of independence of Annam, Mar. 11."], ["1945", "The Kingdom of Cambodia proclaims independence, Mar. 13."], ["1945", "The Kingdom of Luang-Prabang in Indo-China declares its independence, Apr. 8."], ["1945", "Koenisberg, capital of East Prussia captured by Soviet forces, Apr. 11."], ["1945", "Prisident Franklin D. Roosevelt succumbs unexpectedly at Warm Springs, Georgia. Harry S. Truman, Vice-President, sworn in as the new President, Apr. 12."], ["1945", "The United Nations Conference on International Security Organization in San Francisco opened, Apr. 25."], ["1945", "The formation of a provisional Austrian Government, headed by Dr. Karl Renner, Apr. 29."], ["1945", "Benito Mussolini and 12 members of the Fascist Cabinet executed by Italian partizans, Apr. 28."], ["1945", "Fuehrer Adolf Hitler commits suicide in Berlin, May 1."], ["1945", "Premier Stalin announces the complete occupation of Berlin, May 2."], ["1945", "Dr. Joseph Goebbels, German Minister for Propaganda and Public Enlightenment, commits suicide, May 2."], ["1945", "The Allied command formally announces the unconditional surrender of the German forces, May 7."], ["1946", "The German surrender terms ratified in Berlin, May 9."], ["1946", "The wartime coalition cabinet of Britain broken up with the resignation of Winston Churchill, May 23."], ["1946", "T.V. Soong made President of China's Executive Yuan, May 31."], [" wing the resignation of Dr. T.V. Soong, Mar. 1."], ["1947", "Martial law imposed by the British in Jerusalem on 250,000 Jews in Palestine, Mar. 4."], ["1947", "A 50 year defense alliance between France and Britain to act jointly against any future aggression by Germany signed in Dunkerque, Mar. 5."], ["1947", "Martial law proclaimed all over Formosa by the Formosa Defense Commander against the so-called February 28 uprising started by Formosan Chinese under Communist instigation, Mar. 10."], ["1947", "The conclusion of the Japan-Philippines Trade Agreement through SCAP's good offices. As a result, the trade between the two countries will be settled directly in New York on dollar. The Philippine Republic will export 150 tons of hemp to Japan monthly, Mar. 17."], ["1947", "U.S. Secretary of State Marshall rejects Russia's bid for $10,000,000,000 worth of reparations from Germany, Mar. 19."], ["1947", "American Secretary of War Robert Patterson urges Congress to rush aid to Greece lest armed bands led by the Communists seize control, Mar. 25."], ["1947", "The signing of the Dutch-Indonesian Agreement recognizing the sovereignty of the Republic of Indonesia over Java, Sumatra and Madura, Mar. 25."], ["1947", "Death strikes down King George II of Greece, and his younger brother Prince Paul proclaimed successor, Apr. 1."], ["1947", "The United Nations Security Council approves an agreement giving the United States sole trusteeship over the vital strategic area of three Pacific island chains, Apr. 3."], ["1947", "The abdication of King Christian X of Denmark. The throne being succeeded by Crown Prince Frederick, Apr. 8."], ["1947", "General Chang Chun appointed Premier of China as successor to Dr. T.V. Soong, Apr- 17."], ["1947", "The Far Eastern Commission announces its policy of fixing the level of Japanese economy on a line of 1930-1934, Apr. 19."], ["1947", "The joint American-Soviet Conference on Korean problems, May 21."], ["1947", "British Prime Minister Attlee announces before the House of Commons the immediate transfer to India of the British sovereignty on India."], ["1947", "The United Nations Far Eastern Economic Conference held in Shanghai, attended by representatives of 10 nations, June 16."], ["1947", "The U.S. House of Representatives unanimously adopts a bill calling for permission for naturalization of the parents of the Nisei soldiers and sailors who were killed in the war, July 7."], ["1947", "European nations within the Soviet influence launched a concerted appeal to Moscow for sanction to participate in the Paris conference on Marshall's rehabilitation plan, July 9."], ["1947", "The engagement for Princess Elizabeth of England to Prjce Philip Mountbatten officially announced, July 10."], ["1947", "The Far Eastern Commission announces completion of the “basic post-surrender policy” for Japan which will make it possible to collect reparations from Japan in current and future production. The FEC policy, replaces the U.S. government's “initial post-surrender policy” issued in September 1945, July 10."], ["1947", "The European Rehabilitation Conference participated by 16 European nations excluding the Soviet-controlled nations held at Quai d'Orsai, July 12."], ["1947", "The Greek Government notifies the Security Council of the United Nations that a Communist-inspired guerilla force invaded Greece, July 15."], ["1947", "Former Premier of Burma U. Saw and 170 others arrested by the Rangoon police in connection with the assassination of Aung San and five other cabinet ministers, July 21."], ["1947", "Soviet Russia rejects the American invitation to an 11-nation preliminary conference on peace talk for Japan, and proposes instead the speedy con vocation of a four-power foreign ministers council, July 24."], ["1947", "The United Nations Security Council calls upon the Netherlands and the Republic of Indonesia to cease hostilities immediately, Aug. 2."], ["1947", "The establishment of the new Dominion of India, Aug. 15."],    body.sort((a,b)=>{const va=sortVal(a.cells[col].textContent),vb=sortVal(b.cells[col].textContent);
    if(va===null||vb===null)return cmp(va,vb);const c=cmp(va,vb);return next==="ascending"?c:-c});
   out.push(...body,...pinned)});
  out.forEach(r=>tb.appendChild(r))}))}
