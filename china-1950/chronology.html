%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1928 June 9", "t": "The Northern Expeditionary Forces occupied Peking, renamed Peiping.", "p": "99", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1928 July 7", "t": "The National Government announced plan to abrogate unequal treaties and agreements contracted by defunct regimes.", "p": "99", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1928 Nov. 1", "t": "The Central Bank of China established.", "p": "99", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1928 Nov.-Dec.", "t": "The United States, Britain and France formally recognized the National Government as the de jure Government of the Republic of China. These powers also recognized China's tariff autonomy.", "p": "99", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1928 Dec. 29", "t": "Chang Hsueh-liang of the northeast pledged his allegiance to the National Government, thus bringing about the unification of the entire country.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1929 Jan. 1", "t": "Military Reorganization and Disbandment Conference opened in Nanking under the chairmanship of Generalissimo Chiang Kai-shek. A month later adopted important resolutions to reduce Chinese troops.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1929 Mar. 15", "t": "The Kuomintang's Third National Congress convened in Nanking.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1929 May 24", "t": "The Government decided to launch punitive campaign against Feng Yu-hsiang, who revolted in Honan. Feng defeated after defection of his principal subordinates.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1929 June 6", "t": "The state burial of Dr. Sun Yat-sen.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1929 June 12", "t": "The Kuomintang decided to end period of political tutelage by 1935.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1929 July 9", "t": "Chang Hsueh-liang planned to recover Chinese Eastern railway from Soviet control. Failed owing to armed Soviet opposition.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1929 Dec. 5", "t": "Tang Sheng-chih revolted in Honan against National Government.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1930 Jan. 6", "t": "Tang Sheng-chih retired and handed his command to subordinates. One week later remnants of Tang's troops were disarmed.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1930 Apr. 1", "t": "Yen Hsi-shan and Feng Yu-hsiang revolted in north China.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1930 Apr. 18", "t": "Britain returned Weihaiwei to China.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1930 June", "t": "Severe fighting took place between rebel troops and government forces along the Peiping-Hankow, Tientsin-Pukow, Lunghai railways.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1930 July 13", "t": "Rebels held an Enlarged Plenary Session of Kuomintang in Peiping to set up separate government under Wang Ching-wei.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1930 Sept. 14", "t": "Following his defeat in Shantung, Yen retired from public life in Shihchiachuang.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1930 Sept. 18", "t": "Chang Hsueh-liang intervened for government by sending troops to Peiping.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1930 Oct. 10", "t": "With the retirement of the northern coalition leaders, dissolution of the Enlarged Conference, triumphal return of Generalissimo Chiang Kai-shek from the war fronts to Nanking, and acceptance by Chang Hsueh-liang of government appointment, the protracted campaign ended in the reunification of the country.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1930 Nov. 12", "t": "The Kuomintang Fourth National Congress five-day conference closed November 18. Organic law of the National Government revised, the Central Government and National Army reorganized and the National People's Convention to be convoked on May 5, 1931.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 Jan. 1", "t": "National Government announced abolition of likin dues and other duties hampering domestic trade.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 Mar. 2", "t": "Hu Han-min resigned presidency of the Legislative Yuan due to difference of opinion with Generalissimo Chiang Kai-shek on the Provisional Constitution.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 May 5", "t": "The National People's Convention held in Nanking under the chairmanship of Generalissimo Chiang Kai-shek.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 May 12", "t": "The Provisional Constitution adopted.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 May 27", "t": "A dissension movement started in Canton. Wang Ching-wei, Tang Shao-yi, Chen Chi-tang and other Kuomintang leaders met in an extraordinary session of the Kuomintang Central Executive Committee to plot overthrow of the National Government. The dissidents issued a circular telegram urging Generalissimo Chiang Kai-shek to retire.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, 50%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 Sept. 18", "t": "Japanese troops occupied Mukden in surprise attack. By end of month, important cities in Liaoning and Kirin fell into Japanese hands in rapid succession.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 Sept. 24", "t": "Japanese planes dropped bombs on Chinchow and other cities along Peiping-Liaoning railway.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 Oct. 27", "t": "Nanking and Canton representatives met in Shanghai for peace negotiations.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 Nov. 10", "t": "Japanese agents instigated uprising in Tientsin. In ensuing confusion, smuggled Henry Pu Yi to the Northeast.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 Nov. 21", "t": "Gen. Ma Chan-shan offered resistance to Japanese invaders in Heilungkiang.", "p": "100", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 Dec. 15", "t": "Generalissimo Chiang Kai-shek retired for second time in interest of party unity.", "p": "101", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1931 Dec. 28", "t": "National Government was reorganized. Lin Sen made Chairman of the National Government, and Dr. Sun Fo, president of the Executive Yuan.", "p": "101", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1932 Jan. 1", "t": "The new government was inaugurated.", "p": "101", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1932 Jan. 2", "t": "Japanese entered Chinchow.", "p": "101", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1932 Jan. 28", "t": "Kuomintang Central Executive Committee accepted resignation of Dr. Sun Fo as president of Executive Yuan, and appointed Wang Ching-wei to fill vacancy. Dr. Sun named president of the Legislative Yuan.", "p": "101", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1932", "t": "Fighting started in Shanghai between Japanese troops and 19th Route Army. National Military Council created with Generalissimo Chiang Kai-shek as chairman.", "p": "101", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1932 Jan. 30", "t": "The National Government moved to Loyang in face of threat of Japanese attack on Nanking.", "p": "101", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1932 Feb. 7", "t": "National Government and newly-created National Military Council issued circular telegram calling rank and file of National forces to arms.", "p": "101", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1932 Mar. 1", "t": "Kuomintang CEC, held second plenary session in Loyang to devise measures to cope with national crisis.", "p": "101", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1932 Mar. 9", "t": "Henry Pu Yi sworn in as Chief Executive of Japanese puppet state \"Manchukuo\" in northeast with Changchun as capital.", "p": "101", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1932 Mar. 14", "t": "League of Nations' Lytton Commission of Enquiry arrived in Shanghai; reached Nanking March 26, Peiping April 9, then proceeded to Manchuria, where it remained for about six weeks. After second visit to Peiping and Tokyo, commission stayed in Peiping on July 20 to draft report.", "p": "101", "l": "scan part 1, leaf 60", "u": "h d areas. Reds attacked north Hupeh cities.", "p": "114", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1945", "t": "President Chiang declared support for a free Korea on the eve of President Kim Koo's departure for Seoul.", "p": "114", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1945 Nov. 5", "t": "Information Minister Wu branded as \"groundless\" charges of Yenan radio and communist paper in Chungking that American armed assistance to Goverment forces was aimed at Reds. Gen. Wedemeyer denied \"clashes\" between U. S. Marines and communists.", "p": "114", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1945", "t": "Chinese Government submitted to Allied Headquarters a list of 300 Japanese war criminals headed by Emperor Hirohito and including every Japanese premier and foreign minister for past 8 years.", "p": "114", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1945 Nov. 7", "t": "Gen. Wedemeyer in Peiping and Secretary Byrnes in Washington announced U. S. Marines would be recalled soon.", "p": "114", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1945 Nov. 8", "t": "Soviet troops withdrew from Hulutao and Yingkow, leaving Chinese Reds in control of ports, while national forces remained on U. S. ships offshore.", "p": "114", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1945 Nov. 10", "t": "Government troops reported in clashes with communists near Shanhaikwan.", "p": "114", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1945 Nov. 11", "t": "Chungking disclosed Chinese-Soviet negotiations permitted flying government troops into Manchuria since communists barred land and sea routes.", "p": "114", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1945 Nov. 13", "t": "Chungking said Russia agreed to let government fly 1,500 troops a day into Changchun, Manchurian capital, from Peiping, and Soviet forces were withdrawing toward Vladivostok, northern Korea and Port Arthur.", "p": "114", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1945", "t": "Chungking reported communist troops surrounded airfields evacuated by Russians, making landing of government troops by air transport impossible.", "p": "114", "l": "scan part 1, leaf 60", "u": "https://archive.org/details/china-handbook-1950/China%20Handbook%201950%20Part%201%20of%203/page/n60/mode/1up"}, {"a": "Chronology of Major Events — Chronology of Major Events", "s": "", "n": "1945 N const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
E.forEach(e=>{e._n=norm(e.n);e._all=norm(e.n+" "+e.t+" "+e.s)});
const groups=[...new Set(E.map(e=>e.a+(e.s?" — "+e.s:"")))];
const apps=[...new Set(E.map(e=>e.a))];
const sel=$("#ap");
apps.forEach(a=>{const o=document.createElement("option");o.value="A:"+a;o.textContent=a;sel.appendChild(o);
 groups.filter(g=>g.startsWith(a+" — ")).forEach(g=>{const o=document.createElement("option");o.value="G:"+g;o.textContent="   "+g.slice(a.length+3);sel.appendChild(o)})});
function hl(s,terms){s=esc(s);if(!terms.length)return s;
 // highlight accent-insensitively by matching on normalised text
 const src=s,n=norm(src);let marks=[];terms.forEach(t=>{let i=0;const et=norm(esc(t));while(et&&(i=n.indexOf(et,i))>-1){marks.push([i,i+et.length]);i+=et.length}});
 if(!marks.length)return s;marks.sort((a,b)=>a[0]-b[0]);let out="",pos=0;
 marks.forEach(([a,b])=>{if(a<pos)return;out+=src.slice(pos,a)+"<mark>"+src.slice(a,b)+"</mark>";pos=b});return out+src.slice(pos)}
let res=[],shown=0;const STEP=300;
function run(){const q=norm($("#q").value.trim());const terms=q.split(/\s+/).filter(Boolean);const v=sel.value;const no=$("#nameonly").checked;
 res=E.filter(e=>{if(v.startsWith("A:")&&e.a!==v.slice(2))return false;if(v.startsWith("G:")&&e.a+(e.s?" — "+e.s:"")!==v.slice(2))return false;
  const hay=no?e._n:e._all;return terms.every(t=>hay.includes(t))});
 $("#cnt").textContent=`${res.length.toLocaleString()} of ${E.length.toLocaleString()} events`;
 $("#out").innerHTML="";shown=0;more(terms);
 try{history.replaceState(null,"",(q||v)?"#"+new URLSearchParams({q:$("#q").value.trim(),s:v}).toString():location.pathname)}catch(e){}}
function more(terms){terms=terms||norm($("#q").value.trim()).split(/\s+/).filter(Boolean);
 let h="",last=shown?groupOf(res[shown-1]):null;
 res.slice(shown,shown+STEP).forEach(e=>{const g=groupOf(e);if(g!==last){h+=`<div class="sec">${esc(g)}</div>`;last=g}
  h+=`<div class="e"><b>${hl(e.n,terms)}</b> <span class="t">${hl(e.t,terms)}</span><div class="m">p. ${esc(e.p)}${e.u?` · <a href="${e.u}" target="_blank" rel="noopener">${esc(e.l)}</a>`:e.l?" · "+esc(e.l):""}</div></div>`});
 $("#out").insertAdjacentHTML("beforeend",h);shown=Math.min(res.length,shown+STEP);$("#more").hidden=shown>=res.length}
const groupOf=e=>e.a+(e.s?" — "+e.s:"");
let tm;$("#q").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(run,120)});
sel.addEventListener("change",run);$("#nameonly").addEventListener("change",run);$("#more").addEventListener("click",()=>more());
$("#toggle").addEventListener("click",()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"});
try{const p=new URLSearchParams(location.hash.slice(1));if(p.get("q"))$("#q").value=p.get("q");if(p.get("s"))sel.value=p.get("s")}catch(e){}
run();
</script></body></html>
